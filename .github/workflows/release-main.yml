name: Build and publish WireArc images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image and release version (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: read

concurrency:
  group: publish-wg
  cancel-in-progress: false

env:
  # The application pins Asia/Shanghai at startup; upstream traffic tests assume it.
  TZ: Asia/Shanghai
  IMAGE: ghcr.io/aoomee/wirearc
  VERSION: ${{ inputs.version }}

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate version
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-wg([.][0-9]+)?)?$ ]]'

  test:
    needs: validate-version
    uses: ./.github/workflows/checks.yml

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build native Linux panel
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin dist
          go build -trimpath -ldflags="-s -w -X nodectl/internal/version.Version=$VERSION" -o "bin/nodectl-linux-$ARCH" .
          go build -trimpath -ldflags="-s -w -X nodectl/internal/agent.AgentVersion=$VERSION -X nodectl/internal/agent.GitCommit=$GITHUB_SHA -X nodectl/internal/agent.UpdateRepoOwner=aoomee -X nodectl/internal/agent.UpdateRepoName=wirearc" -o "dist/nodectl-agent-linux-$ARCH-$VERSION" ./cmd/nodectl-agent
          (cd dist && sha256sum "nodectl-agent-linux-$ARCH-$VERSION" > "nodectl-agent-linux-$ARCH-$VERSION.sha256")
      - uses: docker/setup-buildx-action@v3
      - name: Build image for native smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/aoomee/wirearc
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Verify running container
        run: bash scripts/smoke-docker.sh "$IMAGE:$VERSION-$ARCH"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image and create offline archive
        run: |
          docker push "$IMAGE:$VERSION-$ARCH"
          docker tag "$IMAGE:$VERSION-$ARCH" "$IMAGE:$VERSION"
          docker save "$IMAGE:$VERSION" | gzip -1 > "dist/wirearc-$VERSION-linux-$ARCH.tar.gz"
          cp "bin/nodectl-linux-$ARCH" dist/
          cp compose.wg.yaml dist/
          cd dist
          sha256sum "wirearc-$VERSION-linux-$ARCH.tar.gz" "nodectl-linux-$ARCH" > "SHA256SUMS-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          compression-level: 0
          retention-days: 7

  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp WG-README.md dist/WG-README.md
          cat > dist/release-notes.md <<'NOTES'
          WireArc 多架构 Docker 镜像与离线包发布（支持 Linux amd64 / arm64 面板机）。

          - **在线部署**：`ghcr.io/aoomee/wirearc:latest`（或锁定本版本标签）
          - **离线加载**：下载对应架构 `wirearc-*.tar.gz`，执行 `docker load -i 文件名`
          - **配套文件**：`compose.wg.yaml` 与 `SHA256SUMS-amd64` / `SHA256SUMS-arm64`

          两种架构均已在 GitHub Linux Runner 完成容器启动、登录鉴权、WG 页面与运行环境验证，并通过全量 Go（含 `-race`）、Python 与 Playwright 浏览器回归测试。
          NOTES
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --title "WireArc $VERSION" --notes-file dist/release-notes.md
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "WireArc $VERSION" --notes-file dist/release-notes.md --latest
          fi
          gh release upload "$VERSION" dist/*.tar.gz dist/nodectl-linux-* dist/nodectl-agent-linux-* dist/SHA256SUMS-* dist/compose.wg.yaml dist/WG-README.md --repo "$GITHUB_REPOSITORY" --clobber
