{{define "node_wg_editor.html"}}
<style>
.node-wg-outbound, .node-wg-setup { box-sizing:border-box; padding:16px; margin:0 0 12px; background:var(--editor-paper); border:1px solid var(--editor-border); border-radius:var(--editor-radius); min-width:0; overflow-wrap:anywhere; }
.protocol-card > .node-wg-outbound { margin:0; border:0; border-top:1px solid var(--editor-border); border-radius:0; background:var(--editor-surface); }
.node-wg-outbound details, .node-wg-setup details { margin-top:14px; border-top:1px solid var(--editor-border); padding-top:6px; }
.node-wg-outbound summary, .node-wg-setup summary { cursor:pointer; font-size:12px; font-weight:600; color:var(--editor-muted); padding:8px 0; }
.node-wg-setup-head, .node-wg-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.node-wg-setup-head { justify-content:space-between; }
.node-wg-setup-head strong { font-size:14px; line-height:1.5; font-weight:650; }
.node-wg-actions { margin-top:14px; }
.node-wg-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; line-height:1.5; font-weight:600; color:var(--editor-muted); }
.node-wg-badge::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
.node-wg-badge[data-tone="success"] { color:#23744b; }
.node-wg-badge[data-tone="warning"] { color:#8a5800; }
.node-wg-badge[data-tone="danger"] { color:#b42318; }
.node-wg-badge[data-tone="progress"] { color:var(--editor-accent); }
.node-wg-route { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin:12px 0; color:var(--editor-muted); font-size:12px; line-height:1.6; }
.node-wg-route b { color:var(--editor-ink); font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:12px; font-weight:600; }
.node-wg-route span { display:inline-flex; align-items:center; gap:4px; }
.node-wg-route i { font-style:normal; color:#7a8ba0; }
.node-wg-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:12px; }
.node-wg-fields[data-mode="direct"] { grid-template-columns:minmax(0,1fr); }
.node-wg-outbound [hidden], .node-wg-setup [hidden] { display:none !important; }
#nodeWGStatus, #nodeWGSetupStatus { margin:10px 0 0; }
.node-wg-outbound label { display:block; margin:0 0 6px; font-size:12px; font-weight:600; color:var(--editor-muted); }
.node-wg-outbound select { width:100%; min-width:0; max-width:100%; min-height:40px; box-sizing:border-box; padding:8px; border:1px solid var(--editor-border); border-radius:var(--editor-radius); background:var(--editor-paper); color:var(--editor-ink); font:inherit; font-size:13px; }
.node-wg-outbound p, .node-wg-setup p { font-size:12px; line-height:1.75; color:var(--editor-muted); }
.node-wg-outbound details p, .node-wg-setup details p { margin:6px 0 10px; }
.node-wg-setup pre { white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.75 ui-monospace, SFMono-Regular, Consolas, monospace; margin:12px 0 0; padding:12px; border:1px solid var(--editor-border); border-radius:var(--editor-radius); background:var(--editor-surface); }
@media (max-width:768px) {
    .node-wg-outbound, .node-wg-setup { padding:14px; }
    .node-wg-fields { grid-template-columns:minmax(0,1fr); }
    .node-wg-actions > button { flex:1 1 auto; }
}
</style>
<script>
let nodeWGEditor = {uuid:'', pair:null, peers:[], ready:false, timer:null, generation:0, request:0, loaded:false, mode:null, peer:null, busy:false, baseline:null};
function resetNodeWGEditor() {
    clearTimeout(nodeWGEditor.timer);
    const button = document.getElementById('btnPushConfig');
    if (button) { button.disabled = false; button.style.opacity = '1'; }
    nodeWGEditor = {uuid:'', pair:null, peers:[], ready:false, timer:null, generation:nodeWGEditor.generation+1, request:0, loaded:false, mode:null, peer:null, busy:false, baseline:null};
    for (const id of ['nodeWGCard','nodeWGSetup']) document.getElementById(id)?.remove();
}
// Compare the user's ordinary configuration, not the frequently refreshed node cache.
function nodeWGOrdinarySnapshot() {
    const fields = Array.from(document.querySelectorAll('#editNodeModal input, #editNodeModal select, #editNodeModal textarea'))
        .filter(el => !el.closest('#nodeWGCard, #nodeWGSetup') && el.id !== 'editNodeUUID')
        .map(el => [el.id || el.className, el.type === 'checkbox' ? el.checked : el.value]);
    const protocols = Array.from(document.querySelectorAll('#protocolListContainer .protocol-card')).map(card => [card.dataset.proto, card.querySelector('.proto-ipmode-item.active')?.dataset.val]);
    return JSON.stringify([fields, protocols]);
}
function nodeWGOrdinaryChanged() { return nodeWGEditor.baseline !== null && nodeWGEditor.baseline !== nodeWGOrdinarySnapshot(); }
function nodeWGBlocksOrdinary() {
    const p = nodeWGEditor.pair;
    return !!p && (p.status !== 'disabled' || (p.topology_version === 2 && !p.restore_direct));
}
function nodeWGMessage(message) {
    nodeWGEditor.error = message;
    const status = document.getElementById('nodeWGStatus') || document.getElementById('nodeWGSetupStatus');
    if (status) status.textContent = message;
}
async function nodeWGRequest(path, body) {
    const response = await fetch(path, body === undefined ? {cache:'no-store'} : {method:'POST', headers:{'Content-Type':'application/json','X-NodeCtl-WG':'1'}, body:JSON.stringify(body)});
    const result = await response.json();
    if (!response.ok || result.status === 'error' || result.error) throw new Error(result.message || result.error || 'WG 请求失败');
    return result.data || result;
}
async function loadNodeWGEditor(uuid) {
    if (!uuid) return false;
    if (nodeWGEditor.uuid && nodeWGEditor.uuid !== uuid) resetNodeWGEditor();
    nodeWGEditor.uuid = uuid;
    if (nodeWGEditor.baseline === null) nodeWGEditor.baseline = nodeWGOrdinarySnapshot();
    const generation = nodeWGEditor.generation, request = ++nodeWGEditor.request;
    renderNodeWGCard();
    try {
        const data = await nodeWGRequest('/api/node/wg/options?uuid='+encodeURIComponent(uuid));
        if (generation !== nodeWGEditor.generation || request !== nodeWGEditor.request || document.getElementById('editNodeUUID').value !== uuid) return false;
        nodeWGEditor.pair = data.pair || null;
        nodeWGEditor.peers = data.peers || [];
        nodeWGEditor.ready = data.ready === true;
        nodeWGEditor.loaded = true;
        nodeWGEditor.error = '';
        if (nodeWGEditor.mode === null) nodeWGEditor.mode = nodeWGBlocksOrdinary() ? 'wg' : 'direct';
        if (nodeWGEditor.peer === null) nodeWGEditor.peer = data.pair?.peer_uuid || '';
        renderNodeWGCard();
        scheduleNodeWGPoll();
        return true;
    } catch (error) {
        if (generation === nodeWGEditor.generation && request === nodeWGEditor.request) {
            nodeWGEditor.loaded = false;
            nodeWGEditor.error = error.message;
            renderNodeWGCard();
            scheduleNodeWGPoll();
        }
        return false;
    }
}
function scheduleNodeWGPoll() {
    clearTimeout(nodeWGEditor.timer);
    const p = nodeWGEditor.pair;
    if (!p || ['active','disabled','failed'].includes(p.status)) return;
    const uuid = nodeWGEditor.uuid, generation = nodeWGEditor.generation;
    nodeWGEditor.timer = setTimeout(() => {
        if (generation === nodeWGEditor.generation) loadNodeWGEditor(uuid);
    }, 2000);
}
function renderNodeWGCard() {
    if (!nodeWGEditor.uuid) return;
    const list = document.getElementById('protocolListContainer');
    const reality = list.querySelector('.protocol-card[data-proto="reality"]');
    const p = nodeWGEditor.pair;
    const landing = document.getElementById('editNodeUIState').value === '2';
    let setup = document.getElementById('nodeWGSetup');
    if (!setup) {
        setup = document.createElement('div'); setup.id = 'nodeWGSetup'; setup.className = 'node-wg-setup';
        setup.innerHTML = `<div class="node-wg-setup-head"><strong>机器连接</strong><span id="nodeWGSetupBadge" class="node-wg-badge"></span></div>
            <p id="nodeWGSetupStatus" role="status" aria-live="polite"></p>
            <div class="node-wg-actions">
                <button type="button" id="nodeWGBind" class="node-editor-button node-editor-button-primary">授权当前机器</button>
                <button type="button" id="nodeWGRefresh" class="node-editor-button">刷新状态</button>
            </div>
            <pre id="nodeWGBinding" role="status" hidden></pre>
            <details id="nodeWGSetupDetails"><summary>首次授权与部署条件</summary>
                <p>先部署 A 的 REALITY 和 B 的 SS，再选择 WG 出站。两端需支持新版 Agent、Linux/systemd、root、ip/wg 工具及可达 UDP。</p>
                <p>首次授权用于确认机器身份，不是 WG 密钥，也不需要每次建隧道都操作。已完成授权的机器无需重复绑定。</p>
                <p>首次授权需在服务器终端确认，连接使用有效的 HTTPS/WSS。支持 NGINX HTTPS → 本机 HTTP 回源，反代部署需先配置面板的可信代理地址。</p>
            </details>`;
        list.insertAdjacentElement('afterend', setup);
        setup.querySelector('#nodeWGRefresh').onclick = () => loadNodeWGEditor(nodeWGEditor.uuid);
        setup.querySelector('#nodeWGBind').onclick = async () => {
            if (!confirm('生成短期单次绑定令牌？请仅在当前机器可信终端输入，勿发给他人。')) return;
            const uuid = nodeWGEditor.uuid, generation = nodeWGEditor.generation;
            const button = setup.querySelector('#nodeWGBind'), output = setup.querySelector('#nodeWGBinding');
            button.disabled = true; output.hidden = false; output.textContent = '正在生成…';
            try {
                const data = await nodeWGRequest('/api/node/agent/enrollment',{node_uuid:uuid,rotate:false});
                if (generation !== nodeWGEditor.generation) return;
                output.textContent = `一次性令牌（过期：${data.expires_at}）：\n${data.token}\n\n在当前服务器运行：\nsudo nodectl-agent enroll -config /etc/nodectl-agent/config.json\n按提示输入令牌并重启 nodectl-agent 服务。`;
            } catch (error) { if (generation === nodeWGEditor.generation) output.textContent = error.message; }
            finally { if (generation === nodeWGEditor.generation) button.disabled = false; }
        };
    }
    const setupBadge = setup.querySelector('#nodeWGSetupBadge');
    setupBadge.textContent = !nodeWGEditor.loaded ? '待检查' : landing ? '落地节点' : nodeWGEditor.ready ? '入口已就绪' : '待就绪';
    setupBadge.dataset.tone = !nodeWGEditor.loaded || landing ? '' : nodeWGEditor.ready ? 'success' : 'warning';
    setup.querySelector('#nodeWGSetupStatus').textContent = nodeWGEditor.error || (landing
        ? '落地 B · 部署 SS 后，在入口 A 中选择本机。首次使用需完成机器授权。'
        : `${document.getElementById('editNodeUIState').value === '1' ? '入口 A' : '已屏蔽'} · ${!nodeWGEditor.loaded ? '正在检查连接与协议…' : nodeWGEditor.ready ? '可配置 WG 出站；已授权的机器无需重复绑定。' : '未就绪。请检查 Agent 在线、机器授权和 REALITY 部署。'}`);
    const helpOpen = document.getElementById('nodeWGUsage')?.open || false;
    const focusedControl = document.activeElement?.closest('#nodeWGCard') ? document.activeElement.id : '';
    document.getElementById('nodeWGCard')?.remove();
    // Outside a REALITY card, only an existing pair's cleanup panel is allowed.
    if ((!reality || landing) && !p) return;
    const card = document.createElement('div'); card.id = 'nodeWGCard'; card.className = 'node-wg-outbound';
    card.innerHTML = `<div class="node-wg-setup-head"><strong>${reality && !landing ? 'REALITY 出站' : '已有配对清理'}</strong><span id="nodeWGPairBadge" class="node-wg-badge"></span></div>
        <div id="nodeWGTopology" class="node-wg-route"></div>
        <div id="nodeWGChoices" class="node-wg-fields"><div><label for="nodeWGMode">出站方式</label><select id="nodeWGMode"><option value="direct">直连</option><option value="wg">经 WG → SS 出站</option></select></div>
        <div id="nodeWGPeerField"><label for="nodeWGPeer">SS 落地节点</label><select id="nodeWGPeer"></select></div></div>
        <p id="nodeWGStatus" role="status" aria-live="polite"></p>
        <details id="nodeWGUsage"><summary id="nodeWGUsageSummary">部署步骤与注意事项</summary>
            <p>① B 推送 SS 成功 → ② A 推送 REALITY 成功 → ③ 选择 WG 与落地节点，点击底部“推送配置”。</p>
            <p>普通协议有修改时，需先在直连模式完成部署，再启用 WG；两步不是原子部署，准备期间为直连。应用出站可能短暂重启 A 的 sing-box。</p>
            <p>配对期间修改协议或落地前需先停用清理；故障不会自动改为直连。首次授权说明位于下方“机器连接”。</p>
        </details>
        <div class="node-wg-actions" id="nodeWGCleanupRow"><button type="button" id="nodeWGCleanup" class="node-editor-button node-editor-button-danger">停用 WG 并恢复直连</button></div>`;
    if (reality && !landing) reality.appendChild(card); else list.insertAdjacentElement('afterend', card);
    card.querySelector('#nodeWGChoices').hidden = !reality || landing;
    const topology = card.querySelector('#nodeWGTopology');
    if (p && p.topology_version !== 2) topology.textContent = '检测到旧版配对。必须先停用并等待清理完成，随后才可部署 REALITY → WG → SS。';
    else topology.innerHTML = '<span>客户端</span><i aria-hidden="true">→</i><span><b>A</b> REALITY</span><i aria-hidden="true">→</i><span><b>WG</b> 隧道</span><i aria-hidden="true">→</i><span><b>B</b> SS</span><i aria-hidden="true">→</i><span>互联网</span>';
    card.querySelector('#nodeWGUsage').open = helpOpen;
    const mode = card.querySelector('#nodeWGMode'), select = card.querySelector('#nodeWGPeer');
    mode.value = nodeWGEditor.mode || 'direct';
    const syncPeerVisibility = () => {
        select.disabled = mode.value !== 'wg'; card.querySelector('#nodeWGPeerField').hidden = mode.value !== 'wg';
        card.querySelector('#nodeWGChoices').dataset.mode = mode.value;
        // Keep the live pair's path visible while the user drafts a direct change.
        topology.hidden = !p && mode.value !== 'wg';
    };
    mode.onchange = () => { nodeWGEditor.mode = mode.value; syncPeerVisibility(); };
    const placeholder = document.createElement('option'); placeholder.value = ''; placeholder.textContent = '请选择已就绪的 SS 落地'; select.appendChild(placeholder);
    for (const peer of nodeWGEditor.peers) {
        const option = document.createElement('option'); option.value = peer.uuid; option.textContent = peer.name + (peer.ready ? '' : '（未就绪）'); option.disabled = !peer.ready; select.appendChild(option);
    }
    if (nodeWGEditor.peer && !Array.from(select.options).some(o => o.value === nodeWGEditor.peer)) {
        const option = document.createElement('option'); option.value = nodeWGEditor.peer; option.textContent = nodeWGEditor.peer + '（当前选择，需重新检查就绪）'; select.appendChild(option);
    }
    select.value = nodeWGEditor.peer || ''; syncPeerVisibility();
    select.onchange = () => { nodeWGEditor.peer = select.value; };
    const blocked = p?.topology_version === 2 && !p.enabled && !p.restore_direct;
    const pairBadge = card.querySelector('#nodeWGPairBadge');
    const labels = {active:'运行中', pending:'部署中', applying:'部署中', recovering:'恢复核验', cleanup_pending:'清理中', disabled:blocked ? '已阻断' : '已停用', failed:'需处理'};
    pairBadge.textContent = p ? (labels[p.status] || '处理中') : '未启用 WG';
    pairBadge.dataset.tone = blocked || p?.status === 'failed' ? 'danger' : p?.status === 'active' ? 'success' : p && p.status !== 'disabled' ? 'progress' : '';
    const stateLabel = p?.status === 'recovering'
        ? '面板重启后正在核验双端连接，核验通过后恢复订阅；失败会保持阻断'
        : `${labels[p?.status] || '处理中'}${p?.status === 'pending' ? '，请等待双端配置完成' : ''}`;
    card.querySelector('#nodeWGStatus').textContent = nodeWGEditor.error || (p
        ? `状态：${stateLabel} · 修订 ${p.revision}${blocked ? ' · REALITY 仍被阻断；需明确恢复直连' : ''}${p.error && p.status !== 'recovering' ? ' · '+p.error : ''}${nodeWGBlocksOrdinary() ? ' · 普通配置已锁定，变更前须先停用清理' : ''}`
        : (nodeWGEditor.ready ? '入口就绪；选择出站后使用推送配置' : '等待入口 REALITY / Agent 就绪'));
    const cleanup = card.querySelector('#nodeWGCleanup'); cleanup.hidden = !nodeWGBlocksOrdinary(); cleanup.disabled = nodeWGEditor.busy;
    card.querySelector('#nodeWGCleanupRow').hidden = cleanup.hidden;
    cleanup.onclick = () => pushNodeWGConfig(true);
    if (focusedControl) card.querySelector('#'+focusedControl)?.focus({preventScroll:true});
}
function nodeWGRealityPort() {
    const card = document.querySelector('#protocolListContainer .protocol-card[data-proto="reality"]');
    if (!card?.querySelector('.proto-switch')?.checked) throw new Error('请先启用并部署 A 的 REALITY');
    let actual;
    try { actual = Number(new URL(card.querySelector('.link-textarea')?.value.trim()).port); } catch (_) { /* unavailable or protected link */ }
    const configured = Number(card.querySelector('.proto-port-input')?.value);
    if (!Number.isInteger(actual) || actual < 1 || actual > 65535 || (configured && configured !== actual)) throw new Error('REALITY 实际链接端口与配置不一致；请先在直连模式完成普通部署');
    return actual;
}
// Return true when the unified push has handled or safely blocked the request.
async function handleNodeWGPush() {
    if (!nodeWGEditor.uuid) return false;
    if (nodeWGEditor.busy) return true;
    if (nodeWGEditor.ordinaryPending) { nodeWGMessage('普通部署尚未收到成功结果；请等待命令日志完成。'); return true; }
    if (!nodeWGEditor.loaded && !await loadNodeWGEditor(nodeWGEditor.uuid)) return true;
    if (nodeWGBlocksOrdinary()) {
        if (nodeWGEditor.mode === 'direct') await pushNodeWGConfig(true);
        else if (nodeWGEditor.pair.topology_version !== 2) nodeWGMessage('旧版配对必须先停用并等待清理完成。');
        else if (nodeWGOrdinaryChanged() || nodeWGEditor.peer !== nodeWGEditor.pair.peer_uuid) nodeWGMessage('配对期间不能修改普通配置或落地。请先点击停用清理，等待完成后再部署；不会自动切换直连。');
        else nodeWGMessage(`当前配对：${nodeWGEditor.pair.status} / ${nodeWGEditor.pair.phase}。${nodeWGEditor.pair.status === 'active' ? '配置未变，无需重复推送。' : '请等待完成；失败或阻断时可明确停用并恢复直连。'}`);
        return true;
    }
    if (nodeWGEditor.mode !== 'wg') return false;
    await pushNodeWGConfig(false);
    return true;
}
async function pushNodeWGConfig(disable = false) {
    if (nodeWGEditor.busy) return;
    if (disable && !confirm('停用配对并清理后将明确恢复 A 的 REALITY 直连。普通配置变更不会同时推送。继续？')) return;
    const uuid = nodeWGEditor.uuid, generation = nodeWGEditor.generation;
    const draftMode = nodeWGEditor.mode, draftPeer = nodeWGEditor.peer;
    const button = document.getElementById('btnPushConfig');
    nodeWGEditor.busy = true; if (button) button.disabled = true;
    try {
        if (!disable) {
            if (nodeWGEditor.ordinaryPending || nodeWGEditor.ordinaryFailed) throw new Error('普通部署未确认成功，请先在直连模式完成普通推送并等待命令成功');
            if (nodeWGOrdinaryChanged()) throw new Error('普通配置有变更：不能安全地同时部署 WG。请明确选择直连并先推送普通配置，等待成功后再选择 WG。准备阶段是直连。');
            await waitForNodeAutoSave();
        }
        if (generation !== nodeWGEditor.generation) return;
        if (!await loadNodeWGEditor(uuid)) throw new Error('无法确认最新配对状态，请刷新重试');
        if (generation !== nodeWGEditor.generation) return;
        const p = nodeWGEditor.pair;
        let peer_uuid = p?.peer_uuid, entry_port = p?.entry_port;
        if (!disable) {
            if (nodeWGEditor.mode !== draftMode || nodeWGEditor.peer !== draftPeer || nodeWGOrdinaryChanged()) throw new Error('配置在等待期间发生变化，请重新推送');
            if (nodeWGBlocksOrdinary()) throw new Error('已有配对尚未清理；请先明确停用并等待清理完成');
            if (!nodeWGEditor.ready || !nodeWGEditor.peers.some(peer => peer.uuid === draftPeer && peer.ready)) throw new Error('A REALITY / B SS 或 Agent 未就绪。请先完成两端普通部署与绑定，再刷新');
            peer_uuid = draftPeer; entry_port = nodeWGRealityPort();
        } else if (!p) throw new Error('没有需要清理的配对');
        const data = await nodeWGRequest('/api/node/wg/push',{uuid,peer_uuid,entry_port,revision:(p?.revision || 0)+1,enabled:!disable});
        if (generation !== nodeWGEditor.generation) return;
        // Invalidate options requests started before this mutation committed.
        ++nodeWGEditor.request;
        nodeWGEditor.pair = data.pair;
        nodeWGEditor.error = '';
        if (disable && nodeWGEditor.mode === draftMode) nodeWGEditor.mode = 'direct';
        renderNodeWGCard(); scheduleNodeWGPoll();
    } catch (error) { if (generation === nodeWGEditor.generation) nodeWGMessage(error.message); }
    finally {
        if (generation === nodeWGEditor.generation) {
            nodeWGEditor.busy = false; if (button) button.disabled = false;
            const cleanup = document.getElementById('nodeWGCleanup'); if (cleanup) cleanup.disabled = false;
        }
    }
}
</script>
