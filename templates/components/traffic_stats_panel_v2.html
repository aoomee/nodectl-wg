<style>
    .traffic-stats-card {
        margin-top: 22px;
    }

    .ts-layout {
        display: grid;
        grid-template-columns: minmax(0, 3.2fr) minmax(0, 1.0fr);
        gap: 18px;
        align-items: stretch;
    }

    .ts-left {
        display: grid;
        grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        min-height: 0;
        height: 100%;
    }

    .ts-panel {
        border: 1px solid rgba(0, 0, 0, 0.045);
        border-radius: 18px;
        background: #f9f9fb;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ts-panel:hover {
        background: #fcfcfd;
        border-color: rgba(0, 122, 255, 0.14);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.025);
    }

    .ts-panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
    }

    .ts-head-left,
    .ts-head-right {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .ts-panel-title {
        font-size: 15.5px;
        font-weight: 700;
        color: #1d1d1f;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .ts-switch {
        display: inline-flex;
        background: #ebebf0;
        border-radius: 999px;
        border: none;
        padding: 3px;
        gap: 2px;
    }

    .ts-switch button {
        border: none;
        background: transparent;
        color: #6e6e73;
        padding: 5px 13px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ts-switch button:hover {
        color: #1d1d1f;
    }

    .ts-switch button.active {
        background: #007aff;
        color: #fff;
        box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
    }

    /* 胶囊化选中节点指示器，避免元素松散漂浮 */
    .ts-selected-node {
        font-size: 13.5px;
        font-weight: 600;
        color: #1d1d1f;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        line-height: 1;
        background: #ffffff;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .ts-selected-node .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4d4f;
        box-shadow: 0 0 0 3px rgba(255, 77, 79, 0.18);
        flex-shrink: 0;
    }

    .ts-selected-node .ts-node-main {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        line-height: 1;
    }

    .ts-selected-node .ts-node-name {
        display: inline-block;
        line-height: 1.1;
        font-weight: 700;
    }

    .ts-selected-node .ts-node-sub {
        display: inline-block;
        margin-left: 6px;
        padding-left: 8px;
        border-left: 1px solid rgba(0, 0, 0, 0.08);
        font-size: 12px;
        font-weight: 500;
        color: #86868b;
        letter-spacing: 0;
        line-height: 1.1;
    }

    .ts-trend-metric {
        font-size: 12.5px;
        color: #6e6e73;
        font-weight: 600;
        background: #ffffff;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .ts-svg {
        width: 100%;
        flex: 1;
        min-height: 220px;
        display: block;
        background: #ffffff;
        border-radius: 14px;
        border: 1px solid rgba(0, 0, 0, 0.04);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.01);
    }

    .ts-chart-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
    }

    .ts-chart-wrap .ts-svg {
        flex: 1;
    }

    .ts-tooltip {
        position: absolute;
        pointer-events: none;
        background: rgba(28, 28, 30, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #fff;
        font-size: 11.5px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 12px;
        white-space: nowrap;
        z-index: 20;
        opacity: 0;
        transition: opacity 0.18s ease;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        line-height: 1.65;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    .ts-tooltip.visible {
        opacity: 1;
    }

    .ts-tooltip .tt-label {
        color: #b0b0ba;
        margin-bottom: 2px;
    }

    .ts-tooltip .tt-row {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .ts-tooltip .tt-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    /* 折线图描点悬停放大动画 */
    .ts-svg .ts-line-dot {
        transition: r 0.18s ease, stroke-width 0.18s ease, filter 0.18s ease;
        cursor: pointer;
    }

    .ts-svg .ts-line-dot:hover {
        filter: drop-shadow(0 0 4px rgba(177, 107, 255, 0.5));
    }

    /* 柱状图悬停高亮 */
    .ts-svg .ts-bar-hit {
        cursor: pointer;
    }

    .ts-legend {
        margin-top: 10px;
        display: flex;
        justify-content: center;
        gap: 16px;
        font-size: 12.5px;
        font-weight: 500;
        color: #6e6e73;
    }

    .ts-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 5px;
        vertical-align: middle;
    }

    .ts-right {
        border: 1px solid rgba(0, 0, 0, 0.045);
        border-radius: 22px;
        background: #f7f8fa;
        padding: 18px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        position: relative;
    }

    .ts-rank-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        position: relative;
    }

    .ts-rank-title {
        font-size: 15.5px;
        font-weight: 700;
        color: #1d1d1f;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    /* 自定义圆润胶囊日期选择器 + 弹出日历面板 */
    .ts-rank-date {
        position: relative;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 600;
        color: #3a3a3c;
        background: #ffffff;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ts-rank-date:hover {
        border-color: rgba(0, 122, 255, 0.35);
        background: #f2f8ff;
        color: #007aff;
    }

    .ts-rank-date svg {
        width: 14px;
        height: 14px;
        color: #007aff;
        flex-shrink: 0;
    }

    /* 隐藏原生丑陋的 date input，保留 DOM 供现有 JS 读写 */
    .ts-rank-date input[type="date"] {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 0;
        height: 0;
        border: none;
        padding: 0;
        margin: 0;
    }

    .ts-custom-cal-popover {
        display: none;
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        width: 268px;
        background: #ffffff;
        border-radius: 22px;
        padding: 16px;
        border: 1px solid rgba(0, 0, 0, 0.06);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.04);
        z-index: 200;
        cursor: default;
        color: #1d1d1f;
        animation: tsCalFadeIn 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .ts-custom-cal-popover.open {
        display: block;
    }

    @keyframes tsCalFadeIn {
        from { opacity: 0; transform: translateY(-6px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .ts-cal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding: 0 2px;
    }

    .ts-cal-month-title {
        font-size: 14px;
        font-weight: 700;
        color: #1d1d1f;
        letter-spacing: -0.01em;
    }

    .ts-cal-nav {
        display: flex;
        gap: 4px;
    }

    .ts-cal-nav-btn {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background: #f2f3f7;
        color: #48484a;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.18s ease;
    }

    .ts-cal-nav-btn:hover {
        background: #eaf4ff;
        color: #007aff;
    }

    .ts-cal-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        color: #86868b;
        margin-bottom: 6px;
    }

    .ts-cal-days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
    }

    .ts-cal-day {
        height: 32px;
        border-radius: 10px;
        border: none;
        background: transparent;
        font-size: 12.5px;
        font-weight: 600;
        color: #1d1d1f;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.16s ease;
        font-variant-numeric: tabular-nums;
    }

    .ts-cal-day:hover:not(.other-month):not(.selected) {
        background: #f0f4ff;
        color: #007aff;
    }

    .ts-cal-day.other-month {
        color: #c7c7cc;
        font-weight: 500;
    }

    .ts-cal-day.today:not(.selected) {
        color: #007aff;
        background: #eef6ff;
    }

    .ts-cal-day.selected {
        background: linear-gradient(180deg, #1a90ff 0%, #007aff 100%);
        color: #ffffff;
        box-shadow: 0 3px 8px rgba(0, 122, 255, 0.3);
    }

    .ts-cal-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(0, 0, 0, 0.05);
    }

    .ts-cal-foot-btn {
        border: none;
        background: #f2f3f7;
        color: #007aff;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.18s ease;
    }

    .ts-cal-foot-btn:hover {
        background: #eaf4ff;
    }

    .ts-rank-summary {
        padding: 10px 8px;
        margin-bottom: 10px;
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.035);
    }

    .ts-rank-kpi {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        text-align: center;
    }

    .ts-rank-kpi .k {
        font-size: 11px;
        color: #86868b;
        margin-bottom: 3px;
    }

    .ts-rank-kpi .v {
        font-size: 11.5px;
        font-weight: 600;
        color: #888;
    }

    .ts-rank-kpi .v.up {
        color: #34c759;
    }

    .ts-rank-kpi .v.down {
        color: #007aff;
    }

    .ts-rank-kpi .v.all {
        color: #9b51e0;
    }

    .ts-rank-list {
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 2px;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    .ts-rank-list::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
    }

    .ts-rank-item {
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 14px;
        padding: 10px 12px;
        cursor: pointer;
        transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
        background: #ffffff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.015);
    }

    .ts-rank-item:hover {
        border-color: rgba(0, 122, 255, 0.3);
        box-shadow: 0 6px 14px rgba(0, 122, 255, 0.07);
        transform: translateY(-1px);
    }

    .ts-rank-item.active {
        border-color: #007aff;
        background: #f2f8ff;
        box-shadow: 0 4px 12px rgba(0, 122, 255, 0.1);
    }

    /* 离线节点斜纹警示底纹 */
    .ts-rank-item.offline {
        background: repeating-linear-gradient(-45deg,
                #fff 0px,
                #fff 6px,
                #fff5f5 6px,
                #fff5f5 12px);
        border-color: rgba(255, 59, 48, 0.25);
    }

    .ts-rank-item.offline.active {
        background: repeating-linear-gradient(-45deg,
                #f2f8ff 0px,
                #f2f8ff 6px,
                #fff0f0 6px,
                #fff0f0 12px);
        border-color: rgba(255, 59, 48, 0.45);
    }

    .ts-rank-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .ts-rank-name {
        font-size: 13.5px;
        font-weight: 600;
        color: #1d1d1f;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .ts-rank-total {
        font-size: 12px;
        font-weight: 700;
        color: #48484a;
        font-variant-numeric: tabular-nums;
    }

    .ts-rank-bar {
        height: 6px;
        border-radius: 999px;
        background: #eef1f7;
        margin-top: 8px;
        overflow: hidden;
    }

    .ts-rank-bar-fill {
        height: 100%;
        display: flex;
    }

    .ts-rank-bar-up {
        background: #34c759;
    }

    .ts-rank-bar-down {
        background: #007aff;
    }

    .ts-rank-meta {
        margin-top: 7px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #86868b;
    }

    .ts-status {
        margin-top: 8px;
        min-height: 16px;
        color: #888;
        font-size: 12px;
    }

    .ts-hidden {
        display: none;
    }

    @media (max-width: 1200px) {
        .ts-layout {
            grid-template-columns: 1fr;
            align-items: start;
        }

        .ts-left {
            grid-template-rows: auto auto;
            height: auto;
        }

        .ts-right {
            min-height: 0;
        }

        .ts-panel-title,
        .ts-rank-title,
        .ts-selected-node {
            font-size: 18px;
        }
    }

    /* 手机端：桌面不显示旋转容器样式 */
    .ts-rotate-wrap {
        display: contents;
    }

    @media (max-width: 768px) {
        .ts-layout {
            display: flex;
            flex-direction: column;
        }

        .traffic-stats-card.sub-card {
            padding: 0;
            border: none;
            box-shadow: none;
            background: transparent;
        }

        .ts-right {
            order: -1;
            min-height: 0;
            width: 100%;
            box-sizing: border-box;
            border-radius: 12px;
            border: 1px solid #ececf2;
            padding: 12px;
        }

        .ts-left {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        /*
         * 手机端图表旋转90度显示
         * 图表原本是宽>高的横向布局，旋转90度后变成纵向，更适合手机浏览
         *
         * 原理：
         * - .ts-panel 的渲染宽度设为较大值（利用手机纵向空间），高度设为容器宽度
         * - 旋转90度后，原来的宽度变成纵向高度，原来的高度变成横向宽度
         * - .ts-rotate-wrap 预留旋转后的占位高度
         */
        .ts-rotate-wrap {
            display: block;
            position: relative;
            width: 100%;
            /* 占位高度 = 面板渲染宽度（旋转后变纵向） */
            --panel-render-w: min(82vh, 640px);
            height: var(--panel-render-w);
            overflow: visible;
        }

        .ts-rotate-wrap .ts-panel {
            position: absolute;
            /* 渲染宽度：利用纵向空间，设为视口高度的82%或640px取小值 */
            width: var(--panel-render-w);
            /* 渲染高度：旋转后填满屏幕宽度 */
            height: calc(100vw - 24px);
            /* 居中于容器 */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
            box-sizing: border-box;
            padding: 10px 14px;
        }

        .ts-rotate-wrap .ts-svg {
            flex: 1;
            min-height: 0;
            height: auto;
        }

        .ts-rotate-wrap .ts-chart-wrap {
            flex: 1;
            min-height: 0;
        }

        .ts-rotate-wrap .ts-panel-header {
            flex-wrap: wrap;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .ts-rotate-wrap .ts-panel-title {
            font-size: 14px;
        }

        .ts-rotate-wrap .ts-selected-node {
            font-size: 13px;
        }

        .ts-rotate-wrap .ts-selected-node .ts-node-sub {
            font-size: 11px;
        }

        .ts-rotate-wrap .ts-trend-metric {
            font-size: 11px;
        }

        .ts-rotate-wrap .ts-legend {
            margin-top: 2px;
            margin-bottom: 0;
            font-size: 12px;
            flex-shrink: 0;
        }

        .ts-svg {
            flex: none;
            height: clamp(220px, 34vh, 280px);
            min-height: 220px;
        }

        .ts-rank-date input {
            min-width: 108px;
        }

        .ts-rank-header {
            gap: 8px;
            flex-wrap: wrap;
        }

        .ts-rank-date {
            margin-left: auto;
        }
    }
</style>

                        <span><i class="ts-dot" style="background:#34c759"></i>上传</span>
                        <span><i class="ts-dot" style="background:#1e88ff"></i>下载</span>
                        <span><i class="ts-dot" style="background:#b16bff"></i>总计</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="ts-right">
            <div class="ts-rank-header">
                <div class="ts-rank-title">
                    <span class="ui-icon-badge indigo" style="width:28px;height:28px;border-radius:9px;">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 20V10"></path>
                            <path d="M12 20V4"></path>
                            <path d="M6 20v-6"></path>
                        </svg>
                    </span>
                    流量消耗
                </div>
                <div class="ts-rank-date" id="ts-rank-date-trigger" title="选择统计日期">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="4" ry="4"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span id="ts-rank-date-label">--</span>
                    <svg style="width:12px;height:12px;color:#86868b;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                    <input type="date" id="ts-rank-date-picker" title="选择统计日期">
                    <div class="ts-custom-cal-popover" id="ts-custom-cal-popover" onclick="event.stopPropagation()">
                        <div class="ts-cal-head">
                            <span class="ts-cal-month-title" id="ts-cal-month-title">2026年 10月</span>
                            <div class="ts-cal-nav">
                                <button type="button" class="ts-cal-nav-btn" id="ts-cal-prev" title="上个月">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                </button>
                                <button type="button" class="ts-cal-nav-btn" id="ts-cal-next" title="下个月">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                </button>
                            </div>
                        </div>
                        <div class="ts-cal-weekdays">
                            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                        </div>
                        <div class="ts-cal-days" id="ts-cal-days"></div>
                        <div class="ts-cal-foot">
                            <button type="button" class="ts-cal-foot-btn" id="ts-cal-today">回到今天</button>
                            <span style="font-size:11px;color:#86868b;font-weight:500;">点击日期切换</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="ts-rank-summary">
                <div class="ts-rank-kpi">
                    <div>
                        <div class="k">上传</div>
                        <div class="v up" id="ts-rank-total-up">0 B</div>
                    </div>
                    <div>
                        <div class="k">下载</div>
                        <div class="v down" id="ts-rank-total-down">0 B</div>
                    </div>
                    <div>
                        <div class="k">总计</div>
                        <div class="v all" id="ts-rank-total-all">0 B</div>
                    </div>
                </div>
            </div>

            <div class="ts-rank-list" id="ts-rank-list"></div>
        </div>
    </div>

    <div class="ts-status" id="ts-status">加载中...</div>
    <select id="ts-node-select" class="ts-hidden"></select>
</div>

<script>
    (function () {
        const RANK_VISIBLE_COUNT_DESKTOP = 10;
        const RANK_VISIBLE_COUNT_MOBILE = 6;
        const RANK_REQUEST_LIMIT = 200;

        const state = {
            nodes: [],
            nodeMap: {},
            rank: null,
            selectedNodeUUID: '',
            rankDate: '',
            barInterval: 1,
            trendMode: 'increment',
            barPoints: [],
            linePoints: [],
            // 实时速率（来自 WS 推送）: node_uuid -> { rx_rate_bps, tx_rate_bps, last_live_at }
            liveRates: {},
            // 实时累计（来自 WS 推送）: node_uuid -> { traffic_up, traffic_down, total_bytes }
            liveTotals: {},
            // 节点在线状态（由后端实时流量消息判定）: node_uuid -> { offline, last_live_at }
            nodeStatus: {},
            liveWs: null,
            rankRerenderTimer: null,
        };

        const nodeSelect = () => document.getElementById('ts-node-select');
        const statusEl = () => document.getElementById('ts-status');
        const barSvg = () => document.getElementById('ts-bar-svg');
        const lineSvg = () => document.getElementById('ts-line-svg');
        const rankDatePicker = () => document.getElementById('ts-rank-date-picker');

        function todayDateStr() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getXAxisTickLimit() {
            return window.innerWidth <= 768 ? 6 : 10;
        }

        function buildTickIndexSet(length, maxTicks) {
            if (length <= 0) return new Set();
            if (length <= maxTicks) {
                return new Set(Array.from({ length }, (_, i) => i));
            }
            const step = Math.ceil((length - 1) / (maxTicks - 1));
            const idx = [];
            for (let i = 0; i < length; i += step) {
                idx.push(i);
            }
            if (idx[idx.length - 1] !== length - 1) {
                idx.push(length - 1);
            }
            return new Set(idx);
        }

        function fmtAxisLabel(raw) {
            const label = String(raw || '');
            if (window.innerWidth <= 768 && label.includes('~')) {
                return label.split('~')[0] || label;
            }
            return (label.split(' ').pop() || label);
        }

        function getRankVisibleCount() {
            return window.innerWidth <= 768 ? RANK_VISIBLE_COUNT_MOBILE : RANK_VISIBLE_COUNT_DESKTOP;
        }

        function syncRankListHeight() {
            const list = document.getElementById('ts-rank-list');
            if (!list) return;

            const isMobile = window.innerWidth <= 768;
            const isTablet = window.innerWidth > 768 && window.innerWidth <= 1200;

            // 平板端不固定高度，避免压缩阅读区域
            if (isTablet) {
                list.style.minHeight = '';
                list.style.maxHeight = '';
                return;
            }

            const rows = Array.from(list.querySelectorAll('.ts-rank-item'));
            if (!rows.length) {
                list.style.minHeight = '';
                list.style.maxHeight = '';
                return;
            }

            const count = Math.min(isMobile ? RANK_VISIBLE_COUNT_MOBILE : RANK_VISIBLE_COUNT_DESKTOP, rows.length);
            const gap = 6;
            let height = 0;
            for (let i = 0; i < count; i++) {
                height += rows[i].offsetHeight;
            }
            height += Math.max(0, count - 1) * gap;

            list.style.minHeight = `${height}px`;
            list.style.maxHeight = `${height}px`;
        }

        function esc(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function buildFlagFallbackDataUri(code) {
            const upper = String(code || '').toUpperCase();
            const isCountry = /^[A-Z]{2}$/.test(upper);
            if (!isCountry) {
                const globeSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#eaf4ff"/><circle cx="12" cy="12" r="7.2" fill="none" stroke="#007aff" stroke-width="1.8"/><line x1="4.8" y1="12" x2="19.2" y2="12" stroke="#007aff" stroke-width="1.6"/><path d="M12 4.8a11 11 0 0 1 2.8 7.2 11 11 0 0 1-2.8 7.2 11 11 0 0 1-2.8-7.2 11 11 0 0 1 2.8-7.2z" fill="none" stroke="#007aff" stroke-width="1.6"/></svg>`;
                return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(globeSvg)}`;
            }
            const emoji = String.fromCodePoint(...upper.split('').map(c => 127397 + c.charCodeAt(0)));
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 18" role="img" aria-label="${upper}">
                    <rect x="0.5" y="0.5" width="23" height="17" rx="4" fill="#f2f3f7"/>
                    <text x="12" y="12.6" text-anchor="middle" font-size="10.6" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">${emoji}</text>
                </svg>
            `;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function flagEmoji(regionCode) {
            const code = String(regionCode || '').trim().toUpperCase();
            if (!/^[A-Z]{2}$/.test(code)) {
                return `<img src="${buildFlagFallbackDataUri('')}" alt="globe" style="width: 18px; height: 18px; vertical-align: middle; display: inline-block; border-radius: 50%;">`;
            }

            const isoCode = code.toLowerCase();
            const fallback = buildFlagFallbackDataUri(code);
            return `<img src="https://flagcdn.com/${isoCode}.svg" loading="lazy" alt="${isoCode}" onerror="this.onerror=null;this.src='${fallback}'" style="width: 18px; height: 13px; object-fit: cover; vertical-align: middle; display: inline-block; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.12);">`;
        }

        function fmtBytes(v, noUnit) {
            const n = Number(v || 0);
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            let val = n;
            while (val >= 1024 && i < units.length - 1) {
                val /= 1024;
                i++;
            }
            if (noUnit) return val.toFixed(2);
            return val.toFixed(2) + ' ' + units[i];
        }

        function fmtGb(v) {
            const n = Number(v || 0);
            return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function fmtAxisGb(v) {
            const gb = Number(v || 0) / 1024 / 1024 / 1024;
            if (gb >= 100) return gb.toFixed(0) + ' GB';
            if (gb >= 10) return gb.toFixed(1) + ' GB';
            return gb.toFixed(2) + ' GB';
        }

        // "2026-02-25 11:20" → "02-25 11:20"
        function fmtUpdateAt(raw) {
            if (!raw || raw === '--') return '--';
            const s = String(raw);
            // 格式 YYYY-MM-DD HH:MM，取 index 5~15
            return s.length >= 16 ? s.slice(5, 16) : s;
        }

        // 格式化速率 (bps → KB/s 或 MB/s)
        function fmtRate(bps) {
            if (!bps || bps <= 0) return '0 KB/s';
            const kbs = bps / 1024;
            if (kbs >= 1024) return (kbs / 1024).toFixed(1) + ' MB/s';
            if (kbs >= 100) return kbs.toFixed(0) + ' KB/s';
            if (kbs >= 10) return kbs.toFixed(1) + ' KB/s';
            return kbs.toFixed(2) + ' KB/s';
        }

        function scheduleRankRerender() {
            if (state.rankRerenderTimer) return;
            state.rankRerenderTimer = setTimeout(function () {
                state.rankRerenderTimer = null;
                renderRank();
            }, 300);
        }

        function recalcRankSummaryFromItems(items) {
            const safeItems = Array.isArray(items) ? items : [];
            let totalUp = 0;
            let totalDown = 0;
            safeItems.forEach(it => {
                totalUp += Number(it.traffic_up || 0);
                totalDown += Number(it.traffic_down || 0);
            });
            document.getElementById('ts-rank-total-up').textContent = fmtBytes(totalUp);
            document.getElementById('ts-rank-total-down').textContent = fmtBytes(totalDown);
            document.getElementById('ts-rank-total-all').textContent = fmtBytes(totalUp + totalDown);
        }

        function applyLiveTotalToRank(nodeUUID, totalRXBytes, totalTXBytes) {
            const rank = state.rank;
            if (!rank || !Array.isArray(rank.items)) return;
            const target = rank.items.find(x => x.uuid === nodeUUID);
            if (!target) return;

            target.traffic_up = Number(totalTXBytes || 0);
            target.traffic_down = Number(totalRXBytes || 0);
            target.total_bytes = Number(totalTXBytes || 0) + Number(totalRXBytes || 0);
            if (Number(target.traffic_up || 0) > 0) {
                target.upload_ratio = (Number(target.traffic_down || 0) / Number(target.traffic_up || 0)).toFixed(2);
            } else {
                target.upload_ratio = '0.00';
            }

            recalcRankSummaryFromItems(rank.items);
            if (nodeUUID === state.selectedNodeUUID) updateSelectedBadge();
        }

        function isNodeOffline(nodeUUID) {
            const status = state.nodeStatus[nodeUUID];
            if (!status) return true;
            return !!status.offline;
        }

        // Connect live traffic websocket.
        function connectLiveWS() {
            if (state.liveWs) {
                try { state.liveWs.close(); } catch (e) { }
            }
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = proto + '//' + location.host + '/api/traffic/live';
            const ws = new WebSocket(wsUrl);
            state.liveWs = ws;

            ws.onopen = function () { };

            ws.onmessage = function (evt) {
                try {
                    const msg = JSON.parse(evt.data);
                    if (msg.node_uuid) {
                        const nowMs = Date.now();
                        const prevLive = state.liveRates[msg.node_uuid] || {};

                        state.liveRates[msg.node_uuid] = {
                            rx_rate_bps: Number(msg.rx_rate_bps || 0),
                            tx_rate_bps: Number(msg.tx_rate_bps || 0),
                            last_live_at: msg.last_live_at || prevLive.last_live_at || 0,
                            updated_at_ms: nowMs
                        };
                        const prevStatus = state.nodeStatus[msg.node_uuid] || {};
                        state.nodeStatus[msg.node_uuid] = {
                            offline: !!msg.offline,
                            last_live_at: Number(msg.last_live_at || prevStatus.last_live_at || 0),
                            updated_at_ms: nowMs
                        };
                        if (typeof msg.total_rx_bytes === 'number' && typeof msg.total_tx_bytes === 'number') {
                            state.liveTotals[msg.node_uuid] = {
                                traffic_up: msg.total_tx_bytes || 0,
                                traffic_down: msg.total_rx_bytes || 0,
                                total_bytes: (msg.total_tx_bytes || 0) + (msg.total_rx_bytes || 0)
                            };
                            applyLiveTotalToRank(msg.node_uuid, msg.total_rx_bytes || 0, msg.total_tx_bytes || 0);
                            scheduleRankRerender();
                        }
                        // 仅更新该节点的速率文字和离线状态，不整体重渲染
                        updateRankItemLive(msg.node_uuid);
                    }
                } catch (e) { }
            };

            ws.onclose = function () {
                // 断线 5 秒后自动重连
                setTimeout(function () {
                    if (document.getElementById('traffic-stats-card')) connectLiveWS();
                }, 5000);
            };

            ws.onerror = function () { ws.close(); };
        }

        // 局部更新排名项的实时速率和离线状态
        function updateRankItemLive(nodeUUID) {
            const el = document.querySelector('.ts-rank-item[data-uuid="' + nodeUUID + '"]');
            if (!el) return;

            const offline = isNodeOffline(nodeUUID);
            el.classList.toggle('offline', offline);

            const rateEl = el.querySelector('.ts-live-rate');
            if (!rateEl) return;

            const live = state.liveRates[nodeUUID];
            if (live && !offline) {
                rateEl.innerHTML = '<span style="color:#34c759;">↑ ' + fmtRate(live.rx_rate_bps) + '</span> <span style="color:#1e88ff;">↓ ' + fmtRate(live.tx_rate_bps) + '</span>';
            } else {
                rateEl.innerHTML = '<span style="color:#ccc;">--</span>';
            }
        }

        function setStatus(msg, isErr) {
            const el = statusEl();
            if (!el) return;
            el.textContent = msg || '';
            el.style.color = isErr ? '#d74242' : '#86868b';
        }

        function updateSelectedBadge() {
            const el = document.getElementById('ts-selected-node');
            if (!el) return;
            const node = state.nodeMap[state.selectedNodeUUID] || {};

            const rankItems = (state.rank && Array.isArray(state.rank.items)) ? state.rank.items : [];
            const selectedItem = rankItems.find(x => x.uuid === state.selectedNodeUUID);
            const todayTotal = selectedItem
                ? Number(selectedItem.today_total_bytes || selectedItem.total_bytes || 0)
                : 0;
            el.innerHTML = `<span class="dot"></span><span class="ts-node-main">${flagEmoji(node.region)} <span class="ts-node-name">${esc(node.name || '--')}</span><span class="ts-node-sub">今日流量: ${fmtBytes(todayTotal)}</span></span>`;
        }

        function computeUsedByLimitType(up, down, limitType) {
            const t = String(limitType || 'total').toLowerCase();
            if (t === 'upload') return Number(up || 0);
            if (t === 'download') return Number(down || 0);
            if (t === 'max') return Math.max(Number(up || 0), Number(down || 0));
            if (t === 'min') return Math.min(Number(up || 0), Number(down || 0));
            return Number(up || 0) + Number(down || 0);
        }

        function updateTrendUsageMetric() {
            const el = document.getElementById('ts-trend-usage');
            if (!el) return;

            const node = state.nodeMap[state.selectedNodeUUID] || {};
            const limit = Number(node.traffic_limit || 0);
            const rankItems = (state.rank && Array.isArray(state.rank.items)) ? state.rank.items : [];
            const selectedItem = rankItems.find(x => x.uuid === state.selectedNodeUUID);

            let used = 0;
            const liveTotal = state.liveTotals[state.selectedNodeUUID];
            if (liveTotal) {
                used = computeUsedByLimitType(
                    Number(liveTotal.traffic_up || 0),
                    Number(liveTotal.traffic_down || 0),
                    node.traffic_limit_type || 'total'
                );
            } else if (selectedItem && selectedItem.traffic_used_bytes !== undefined && selectedItem.traffic_used_bytes !== null) {
                used = Number(selectedItem.traffic_used_bytes || 0);
            } else if (selectedItem) {
                used = Number(selectedItem.total_bytes || 0);
            }

            if (limit > 0) {
                const pct = Math.min(100, (used / limit) * 100).toFixed(2);
                el.textContent = `${fmtBytes(used)} / ${fmtBytes(limit)} (${pct}%)`;
            } else {
                el.textContent = `已用流量: ${fmtBytes(used)}`;
            }
        }

        async function loadLandingNodes() {
            const res = await fetch('/api/traffic/landing-nodes');
            const data = await res.json();
            if (!data || data.status !== 'success') throw new Error((data && data.message) || '读取节点失败');

            state.nodes = Array.isArray(data.nodes) ? data.nodes : [];
            state.nodeMap = {};
            state.nodes.forEach(n => {
                state.nodeMap[n.uuid] = {
                    uuid: n.uuid,
                    name: n.name,
                    region: n.region || '',
                    traffic_limit: n.traffic_limit || 0,
                    traffic_limit_type: n.traffic_limit_type || 'total'
                };
                if (!state.nodeStatus[n.uuid]) {
                    state.nodeStatus[n.uuid] = {
                        offline: true,
                        last_live_at: 0,
                        updated_at_ms: 0
                    };
                }
            });

            if (nodeSelect()) {
                nodeSelect().innerHTML = state.nodes.map(n => `<option value="${esc(n.uuid)}">${esc(n.name || n.uuid)}</option>`).join('');
            }
        }

        async function loadRank() {
            const q = new URLSearchParams({
                limit: String(RANK_REQUEST_LIMIT),
                date: state.rankDate || todayDateStr()
            });
            const res = await fetch('/api/traffic/consumption-rank?' + q.toString());
            const data = await res.json();
            if (!data || data.status !== 'success') throw new Error((data && data.message) || '读取流量排行失败');

            state.rank = data.rank || null;
            state.rankDate = (state.rank && state.rank.generated_at) || state.rankDate || todayDateStr();
            if (rankDatePicker()) rankDatePicker().value = state.rankDate;
            syncCustomDateDisplay();

            const items = (state.rank && Array.isArray(state.rank.items)) ? state.rank.items : [];
            items.forEach(it => {
                const prevStatus = state.nodeStatus[it.uuid] || {};
                state.nodeStatus[it.uuid] = {
                    offline: (typeof prevStatus.offline === 'boolean') ? !!prevStatus.offline : !!it.offline,
                    last_live_at: Number(prevStatus.last_live_at || 0),
                    updated_at_ms: Number(prevStatus.updated_at_ms || 0)
                };
                if (it.today_total_bytes === undefined || it.today_total_bytes === null) {
                    it.today_total_bytes = Number(it.total_bytes || 0);
                }
            });
            items.forEach(it => {
                if (!state.nodeMap[it.uuid]) {
                    state.nodeMap[it.uuid] = {
                        uuid: it.uuid,
                        name: it.name,
                        region: it.region || '',
                        traffic_limit: it.traffic_limit || 0,
                        traffic_limit_type: it.traffic_limit_type || 'total'
                    };
                } else {
                    state.nodeMap[it.uuid].traffic_limit = it.traffic_limit || 0;
                    state.nodeMap[it.uuid].traffic_limit_type = it.traffic_limit_type || 'total';
                }
            });

            const inRank = items.some(x => x.uuid === state.selectedNodeUUID);
            if (!state.selectedNodeUUID || !inRank) {
                if (items.length) state.selectedNodeUUID = items[0].uuid;
                else if (state.nodes.length) state.selectedNodeUUID = state.nodes[0].uuid;
            }

            document.getElementById('ts-rank-total-up').textContent = fmtBytes((state.rank && state.rank.total_up) || 0);
            document.getElementById('ts-rank-total-down').textContent = fmtBytes((state.rank && state.rank.total_down) || 0);
            document.getElementById('ts-rank-total-all').textContent = fmtBytes((state.rank && state.rank.total_bytes) || 0);

            updateSelectedBadge();
            updateTrendUsageMetric();
        }

        function renderRank() {
            const list = document.getElementById('ts-rank-list');
            const items = (state.rank && Array.isArray(state.rank.items)) ? [...state.rank.items] : [];

            if (!items.length) {
                list.innerHTML = '<div style="padding:8px; color:#999; font-size:12px;">暂无流量数据</div>';
                return;
            }

            items.forEach(item => {
                const liveTotal = state.liveTotals[item.uuid];
                if (item.today_total_bytes === undefined || item.today_total_bytes === null) {
                    item.today_total_bytes = Number(item.total_bytes || 0);
                }
                if (liveTotal) {
                    item.traffic_up = Number(liveTotal.traffic_up || 0);
                    item.traffic_down = Number(liveTotal.traffic_down || 0);
                    item.total_bytes = Number(liveTotal.total_bytes || 0);
                    if (Number(item.traffic_up || 0) > 0) {
                        item.upload_ratio = (Number(item.traffic_down || 0) / Number(item.traffic_up || 0)).toFixed(2);
                    } else {
                        item.upload_ratio = '0.00';
                    }
                }
            });

            items.sort((a, b) => Number(b.total_bytes || 0) - Number(a.total_bytes || 0));
            if (state.rank && Array.isArray(state.rank.items)) {
                state.rank.items = items;
            }
            recalcRankSummaryFromItems(items);
            updateSelectedBadge();
            updateTrendUsageMetric();

            const maxTotal = Math.max(1, ...items.map(x => Number(x.total_bytes || 0)));

            // 构建新排序后的 uuid 列表，用于判断是否需要完整重建
            const newOrder = items.map(x => x.uuid);
            const existingEls = list.querySelectorAll('.ts-rank-item');
            const existingOrder = Array.from(existingEls).map(el => el.getAttribute('data-uuid'));
            const orderMatch = newOrder.length === existingOrder.length && newOrder.every((u, i) => u === existingOrder[i]);

            if (orderMatch && existingEls.length > 0) {
                // 就地更新：顺序未变，仅更新每个已存在元素的文字和样式
                items.forEach((item, i) => {
                    const el = existingEls[i];
                    const up = Number(item.traffic_up || 0);
                    const down = Number(item.traffic_down || 0);
                    const total = Number(item.total_bytes || 0);
                    const isActive = item.uuid === state.selectedNodeUUID;
                    const widthPct = Math.max(1, total / maxTotal * 100);
                    const upPct = total > 0 ? up / total * 100 : 0;
                    const offline = isNodeOffline(item.uuid);

                    el.classList.toggle('active', isActive);
                    el.classList.toggle('offline', offline);

                    const totalEl = el.querySelector('.ts-rank-total');
                    if (totalEl) totalEl.textContent = fmtGb(total);

                    const barFill = el.querySelector('.ts-rank-bar-fill');
                    if (barFill) barFill.style.width = widthPct.toFixed(2) + '%';
                    const barUp = el.querySelector('.ts-rank-bar-up');
                    if (barUp) barUp.style.width = upPct.toFixed(2) + '%';
                    const barDown = el.querySelector('.ts-rank-bar-down');
                    if (barDown) barDown.style.width = (100 - upPct).toFixed(2) + '%';

                    const metaDiv = el.querySelector('.ts-rank-meta > div');
                    if (metaDiv) {
                        const spans = metaDiv.querySelectorAll('span');
                        if (spans[0]) spans[0].textContent = '↑ ' + fmtGb(up);
                        if (spans[1]) spans[1].textContent = '↓ ' + fmtGb(down);
                        if (spans[2]) spans[2].textContent = Number(item.upload_ratio || 0).toFixed(2);
                    }

                    // 更新活跃指示点
                    const nameEl = el.querySelector('.ts-rank-name');
                    if (nameEl) {
                        const dot = nameEl.querySelector('.ts-dot');
                        if (isActive && !dot) {
                            const newDot = document.createElement('i');
                            newDot.className = 'ts-dot';
                            newDot.style.cssText = 'background:#34c759; margin:0; width:6px; height:6px;';
                            nameEl.appendChild(newDot);
                        } else if (!isActive && dot) {
                            dot.remove();
                        }
                    }

                    // 更新实时速率
                    const rateEl = el.querySelector('.ts-live-rate');
                    if (rateEl) {
                        const live = state.liveRates[item.uuid];
                        if (live && !offline) {
                            rateEl.innerHTML = '<span style="color:#34c759;">↑ ' + fmtRate(live.rx_rate_bps) + '</span> <span style="color:#1e88ff;">↓ ' + fmtRate(live.tx_rate_bps) + '</span>';
                        } else {
                            rateEl.innerHTML = '<span style="color:#ccc;">--</span>';
                        }
                    }
                });
                syncRankListHeight();
                return;
            }

            // 完整重建：顺序变化或首次渲染
            list.innerHTML = items.map(item => {
                const up = Number(item.traffic_up || 0);
                const down = Number(item.traffic_down || 0);
                const total = Number(item.total_bytes || 0);
                const active = item.uuid === state.selectedNodeUUID ? 'active' : '';
                const widthPct = Math.max(1, total / maxTotal * 100);
                const upPct = total > 0 ? up / total * 100 : 0;
                const offline = isNodeOffline(item.uuid);
                const offlineCls = offline ? 'offline' : '';

                // 实时速率
                const live = state.liveRates[item.uuid];
                let rateHtml;
                if (live && !offline) {
                    rateHtml = '<span style="color:#34c759;">↑ ' + fmtRate(live.rx_rate_bps) + '</span> <span style="color:#1e88ff;">↓ ' + fmtRate(live.tx_rate_bps) + '</span>';
                } else {
                    rateHtml = '<span style="color:#ccc;">--</span>';
                }

                return `
                    <div class="ts-rank-item ${active} ${offlineCls}" data-uuid="${esc(item.uuid)}">
                        <div class="ts-rank-top">
                            <div class="ts-rank-name">
                                ${flagEmoji(item.region)} 
                                <span style="margin-right:4px">${esc(item.name || item.uuid)}</span>
                                ${active ? '<i class="ts-dot" style="background:#34c759; margin:0; width:6px; height:6px;"></i>' : ''}
                            </div>
                            <div class="ts-rank-total">${esc(fmtGb(total))}</div>
                        </div>
                        <div class="ts-rank-bar">
                            <div class="ts-rank-bar-fill" style="width:${widthPct.toFixed(2)}%">
                                <div class="ts-rank-bar-up" style="width:${upPct.toFixed(2)}%"></div>
                                <div class="ts-rank-bar-down" style="width:${(100 - upPct).toFixed(2)}%"></div>
                            </div>
                        </div>
                        <div class="ts-rank-meta">
                            <div style="display:flex; gap:6px; align-items:center;">
                                <span style="color:#34c759;">↑ ${fmtGb(up)}</span>
                                <span style="color:#1e88ff;">↓ ${fmtGb(down)}</span>
                                <span style="color:#b16bff;">${esc(Number(item.upload_ratio || 0).toFixed(2))}</span>
                            </div>
                            <span class="ts-live-rate" style="font-size:10px; white-space:nowrap; font-variant-numeric:tabular-nums;">${rateHtml}</span>
                        </div>
                    </div>
                `;
            }).join('');

            list.querySelectorAll('.ts-rank-item').forEach(el => {
                el.addEventListener('click', async function () {
                    const uuid = String(el.getAttribute('data-uuid') || '');
                    if (!uuid || uuid === state.selectedNodeUUID) return;
                    state.selectedNodeUUID = uuid;
                    if (nodeSelect()) nodeSelect().value = uuid;
                    updateSelectedBadge();
                    renderRank();
                    await loadSeriesAndRender();
                });
            });

            syncRankListHeight();
        }

        async function fetchSeries(mode, intervalHours, rawPoints) {
            if (!state.selectedNodeUUID) return [];
            const q = new URLSearchParams({
                node_uuid: state.selectedNodeUUID,
                mode: mode,
                hours: '24',
                interval_hours: String(intervalHours),
                date: state.rankDate || todayDateStr()
            });
            if (rawPoints) {
                q.set('raw', '1');
            }
            const res = await fetch('/api/traffic/series?' + q.toString());
            const data = await res.json();
            if (!data || data.status !== 'success') throw new Error((data && data.message) || '读取统计失败');
            return (data.series && Array.isArray(data.series.points)) ? data.series.points : [];
        }

        function isMobileRotated() {
            return window.innerWidth <= 768;
        }

        function getChartFontSize() {
            return isMobileRotated() ? { axis: '12', tick: '13', yAxis: '12' } : { axis: '10.2', tick: '11.5', yAxis: '10.2' };
        }

        function getChartSize(svg) {
            let w, h;
            if (isMobileRotated() && svg) {
                // 手机旋转模式：直接使用 SVG 容器的实际像素尺寸
                // 这样 viewBox 和容器比例一致，不会产生多余空白
                w = Math.max(400, Math.floor(svg.clientWidth || 400));
                h = Math.max(180, Math.floor(svg.clientHeight || 200));
            } else {
                w = Math.max(960, Math.floor((svg && svg.clientWidth) || 960));
                h = Math.max(250, Math.floor((svg && svg.clientHeight) || 280));
            }
            if (svg) {
                svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
                svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            }
            return { w, h };
        }

        function renderBar() {
            const svg = barSvg();
            const points = state.barPoints;
            if (!points || !points.length) {
                svg.innerHTML = '<text x="480" y="125" text-anchor="middle" fill="#999" font-size="13">暂无数据</text>';
                return;
            }

            const fs = getChartFontSize();
            const size = getChartSize(svg);
            const w = size.w, h = size.h, left = 64, right = 28, top = 12, bottom = 20;
            const chartW = w - left - right;
            const chartH = h - top - bottom;
            const maxV = Math.max(1, ...points.map(p => Number(p.total_bytes || 0)));
            const groupW = chartW / points.length;
            const barW = Math.max(4, Math.min(20, groupW * 0.72));
            const tickSet = buildTickIndexSet(points.length, getXAxisTickLimit());

            let out = '';
            for (let i = 0; i <= 5; i++) {
                const y = top + chartH * i / 5;
                const val = maxV * (5 - i) / 5;
                out += `<line x1="${left}" y1="${y.toFixed(2)}" x2="${w - right}" y2="${y.toFixed(2)}" stroke="#f0f1f6"/>`;
                out += `<text x="${left - 6}" y="${(y + 3).toFixed(2)}" text-anchor="end" fill="#8f8f9a" font-size="${fs.yAxis}" font-weight="600" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">${esc(fmtAxisGb(val))}</text>`;
            }
            out += `<line x1="${left}" y1="${h - bottom}" x2="${w - right}" y2="${h - bottom}" stroke="#d6d6de"/>`;
            out += `<circle cx="${left}" cy="${h - bottom}" r="3.2" fill="#34c759" stroke="#fff" stroke-width="1"/>`;
            out += `<circle cx="${w - right}" cy="${h - bottom}" r="3.2" fill="#ff6b6b" stroke="#fff" stroke-width="1"/>`;

            let hitAreas = '';
            points.forEach((p, i) => {
                const up = Number(p.up_bytes || 0);
                const down = Number(p.down_bytes || 0);
                const total = Number(p.total_bytes || 0);
                const x = left + i * groupW + (groupW - barW) / 2;
                const totalH = total > 0 ? Math.max(2, chartH * (total / maxV)) : 0;
                const upH = total > 0 ? totalH * (up / total) : 0;
                const downH = totalH - upH;
                const yDown = top + chartH - totalH;
                const yUp = yDown + downH;

                if (totalH > 0) {
                    out += `<rect x="${x.toFixed(2)}" y="${yDown.toFixed(2)}" width="${barW.toFixed(2)}" height="${downH.toFixed(2)}" fill="#1e88ff" rx="2"/>`;
                    out += `<rect x="${x.toFixed(2)}" y="${yUp.toFixed(2)}" width="${barW.toFixed(2)}" height="${upH.toFixed(2)}" fill="#34c759" rx="2"/>`;
                }

                if (tickSet.has(i)) {
                    const label = fmtAxisLabel(p.label);
                    out += `<text x="${(left + i * groupW + groupW / 2).toFixed(2)}" y="${h - 6}" text-anchor="middle" fill="#70707c" font-size="${fs.tick}" font-weight="600" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">${esc(label)}</text>`;
                }

                // 透明hit区域覆盖整个柱组宽度
                const hitX = left + i * groupW;
                hitAreas += `<rect class="ts-bar-hit" x="${hitX.toFixed(2)}" y="${top}" width="${groupW.toFixed(2)}" height="${chartH}" fill="transparent" data-idx="${i}"/>`;
            });
            out += hitAreas;
            svg.innerHTML = out;

            // 绑定柱状图 tooltip 事件
            const wrap = document.getElementById('ts-bar-wrap');
            const tip = document.getElementById('ts-bar-tooltip');
            if (!wrap || !tip) return;
            svg.querySelectorAll('.ts-bar-hit').forEach(hitEl => {
                hitEl.addEventListener('mouseenter', function (e) {
                    const idx = parseInt(this.getAttribute('data-idx'));
                    const p = points[idx];
                    if (!p) return;
                    const up = Number(p.up_bytes || 0);
                    const down = Number(p.down_bytes || 0);
                    const total = Number(p.total_bytes || 0);
                    const label = p.label || '';
                    tip.innerHTML = `<div class="tt-label">${esc(label)}</div><div class="tt-row"><span class="tt-dot" style="background:#34c759"></span>上传: ${esc(fmtBytes(up))}</div><div class="tt-row"><span class="tt-dot" style="background:#1e88ff"></span>下载: ${esc(fmtBytes(down))}</div><div class="tt-row" style="border-top:1px solid rgba(255,255,255,0.12);padding-top:3px;margin-top:2px;"><span class="tt-dot" style="background:#aaa"></span>总计: ${esc(fmtBytes(total))}</div>`;
                    tip.classList.add('visible');
                    positionTooltip(tip, wrap, e);
                });
                hitEl.addEventListener('mousemove', function (e) {
                    positionTooltip(tip, wrap, e);
                });
                hitEl.addEventListener('mouseleave', function () {
                    tip.classList.remove('visible');
                });
            });
        }

        function renderLine() {
            const svg = lineSvg();
            const points = state.linePoints;
            if (!points || !points.length) {
                svg.innerHTML = '<text x="480" y="125" text-anchor="middle" fill="#999" font-size="13">暂无数据</text>';
                return;
            }

            const fs = getChartFontSize();
            const size = getChartSize(svg);
            const w = size.w, h = size.h, left = 64, right = 28, top = 12, bottom = 20;
            const chartW = w - left - right;
            const chartH = h - top - bottom;
            const maxV = Math.max(1, ...points.map(p => Number(p.total_bytes || 0)));
            const tickSet = buildTickIndexSet(points.length, getXAxisTickLimit());

            function xy(i, v) {
                const x = left + (points.length <= 1 ? chartW / 2 : (chartW * i / (points.length - 1)));
                const y = top + chartH - chartH * (v / maxV);
                return [x, y];
            }

            let upPath = '';
            let downPath = '';
            let totalPath = '';
            let axisLabels = '';
            let dotsSvg = '';

            points.forEach((p, i) => {
                const up = Number(p.up_bytes || 0);
                const down = Number(p.down_bytes || 0);
                const total = Number(p.total_bytes || 0);
                const [ux, uy] = xy(i, up);
                const [dx, dy] = xy(i, down);
                const [tx, ty] = xy(i, total);

                upPath += (i === 0 ? `M ${ux} ${uy}` : ` L ${ux} ${uy}`);
                downPath += (i === 0 ? `M ${dx} ${dy}` : ` L ${dx} ${dy}`);
                totalPath += (i === 0 ? `M ${tx} ${ty}` : ` L ${tx} ${ty}`);

                if (tickSet.has(i)) {
                    const label = fmtAxisLabel(p.label);
                    axisLabels += `<text x="${ux}" y="${h - 6}" text-anchor="middle" fill="#70707c" font-size="${fs.tick}" font-weight="600" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">${esc(label)}</text>`;
                }

                // 可见描点 + 透明交互热区
                dotsSvg += `<circle cx="${tx.toFixed(2)}" cy="${ty.toFixed(2)}" r="3" fill="#b16bff" stroke="#fff" stroke-width="1.5" class="ts-line-dot" data-idx="${i}"/>`;
                dotsSvg += `<circle cx="${tx.toFixed(2)}" cy="${ty.toFixed(2)}" r="14" fill="transparent" class="ts-line-dot" data-idx="${i}" style="stroke:none;"/>`;
            });

            const [fx] = xy(0, Number(points[0].total_bytes || 0));
            const [lx] = xy(points.length - 1, Number(points[points.length - 1].total_bytes || 0));
            const areaPath = `${totalPath} L ${lx} ${h - bottom} L ${fx} ${h - bottom} Z`;

            let yGuides = '';
            for (let i = 0; i <= 5; i++) {
                const y = top + chartH * i / 5;
                const val = maxV * (5 - i) / 5;
                yGuides += `<line x1="${left}" y1="${y.toFixed(2)}" x2="${w - right}" y2="${y.toFixed(2)}" stroke="#f0f1f6"/>`;
                yGuides += `<text x="${left - 6}" y="${(y + 3).toFixed(2)}" text-anchor="end" fill="#8f8f9a" font-size="${fs.yAxis}" font-weight="600" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">${esc(fmtAxisGb(val))}</text>`;
            }

            svg.innerHTML = `
                ${yGuides}
                <line x1="${left}" y1="${h - bottom}" x2="${w - right}" y2="${h - bottom}" stroke="#d6d6de"/>
                <circle cx="${left}" cy="${h - bottom}" r="3.2" fill="#34c759" stroke="#fff" stroke-width="1"/>
                <circle cx="${w - right}" cy="${h - bottom}" r="3.2" fill="#ff6b6b" stroke="#fff" stroke-width="1"/>
                <path d="${areaPath}" fill="rgba(177,107,255,0.10)" stroke="none"/>
                <path d="${upPath}" fill="none" stroke="#34c759" stroke-width="1.8"/>
                <path d="${downPath}" fill="none" stroke="#1e88ff" stroke-width="1.8"/>
                <path d="${totalPath}" fill="none" stroke="#b16bff" stroke-width="1.8" stroke-dasharray="4 3"/>
                ${axisLabels}
                ${dotsSvg}
            `;

            // 绑定折线图 tooltip + 放大动画事件
            const wrap = document.getElementById('ts-line-wrap');
            const tip = document.getElementById('ts-line-tooltip');
            if (!wrap || !tip) return;

            let activeDotEl = null;
            svg.querySelectorAll('.ts-line-dot').forEach(dotEl => {
                dotEl.addEventListener('mouseenter', function (e) {
                    const idx = parseInt(this.getAttribute('data-idx'));
                    const p = points[idx];
                    if (!p) return;

                    // 放大同索引的可见描点（第一个同 data-idx 的 circle）
                    if (activeDotEl) { activeDotEl.setAttribute('r', '3'); activeDotEl.setAttribute('stroke-width', '1.5'); }
                    const visibleDot = svg.querySelector(`.ts-line-dot[data-idx="${idx}"][fill="#b16bff"]`);
                    if (visibleDot) { visibleDot.setAttribute('r', '6'); visibleDot.setAttribute('stroke-width', '2.5'); activeDotEl = visibleDot; }

                    const up = Number(p.up_bytes || 0);
                    const down = Number(p.down_bytes || 0);
                    const total = Number(p.total_bytes || 0);
                    const label = p.label || '';
                    tip.innerHTML = `<div class="tt-label">${esc(label)}</div><div class="tt-row"><span class="tt-dot" style="background:#34c759"></span>上传: ${esc(fmtBytes(up))}</div><div class="tt-row"><span class="tt-dot" style="background:#1e88ff"></span>下载: ${esc(fmtBytes(down))}</div><div class="tt-row" style="border-top:1px solid rgba(255,255,255,0.12);padding-top:3px;margin-top:2px;"><span class="tt-dot" style="background:#b16bff"></span>总计: ${esc(fmtBytes(total))}</div>`;
                    tip.classList.add('visible');
                    positionTooltip(tip, wrap, e);
                });
                dotEl.addEventListener('mousemove', function (e) {
                    positionTooltip(tip, wrap, e);
                });
                dotEl.addEventListener('mouseleave', function () {
                    if (activeDotEl) { activeDotEl.setAttribute('r', '3'); activeDotEl.setAttribute('stroke-width', '1.5'); activeDotEl = null; }
                    tip.classList.remove('visible');
                });
            });
        }

        function positionTooltip(tip, wrap, e) {
            const rect = wrap.getBoundingClientRect();
            let x = e.clientX - rect.left + 12;
            let y = e.clientY - rect.top - 10;
            // 防止右侧溢出
            const tipW = tip.offsetWidth || 140;
            const tipH = tip.offsetHeight || 80;
            if (x + tipW > rect.width - 4) x = e.clientX - rect.left - tipW - 8;
            if (y + tipH > rect.height - 4) y = rect.height - tipH - 4;
            if (y < 4) y = 4;
            tip.style.left = x + 'px';
            tip.style.top = y + 'px';
        }

        async function loadSeriesAndRender() {
            state.barPoints = await fetchSeries('increment', state.barInterval, false);
            state.linePoints = await fetchSeries(state.trendMode, 1, true);

            if (state.trendMode === 'total' && state.linePoints && state.linePoints.length > 0) {
                const baseUp = Number(state.linePoints[0].up_bytes || 0);
                const baseDown = Number(state.linePoints[0].down_bytes || 0);
                const baseTotal = Number(state.linePoints[0].total_bytes || 0);
                state.linePoints = state.linePoints.map(p => ({
                    ...p,
                    up_bytes: Math.max(0, Number(p.up_bytes || 0) - baseUp),
                    down_bytes: Math.max(0, Number(p.down_bytes || 0) - baseDown),
                    total_bytes: Math.max(0, Number(p.total_bytes || 0) - baseTotal)
                }));
            }

            renderBar();
            renderLine();
            updateSelectedBadge();
            updateTrendUsageMetric();

            setStatus('', false);
        }

        let calViewYear = new Date().getFullYear();
        let calViewMonth = new Date().getMonth();

        function syncCustomDateDisplay() {
            const labelEl = document.getElementById('ts-rank-date-label');
            const val = state.rankDate || (rankDatePicker() && rankDatePicker().value) || todayDateStr();
            if (labelEl) {
                labelEl.textContent = val.replace(/-/g, ' / ');
            }
            const parts = val.split('-');
            if (parts.length === 3) {
                calViewYear = parseInt(parts[0], 10) || new Date().getFullYear();
                calViewMonth = (parseInt(parts[1], 10) || 1) - 1;
            }
            renderCustomCalendarGrid();
        }

        function renderCustomCalendarGrid() {
            const titleEl = document.getElementById('ts-cal-month-title');
            const daysEl = document.getElementById('ts-cal-days');
            if (!titleEl || !daysEl) return;

            titleEl.textContent = `${calViewYear}年 ${calViewMonth + 1}月`;

            const firstDay = new Date(calViewYear, calViewMonth, 1).getDay();
            const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
            const prevMonthDays = new Date(calViewYear, calViewMonth, 0).getDate();

            const selectedStr = state.rankDate || todayDateStr();
            const todayStr = todayDateStr();

            let html = '';
            // 上月补齐
            for (let i = firstDay - 1; i >= 0; i--) {
                const d = prevMonthDays - i;
                html += `<button type="button" class="ts-cal-day other-month" disabled>${d}</button>`;
            }
            // 当月日期
            for (let d = 1; d <= daysInMonth; d++) {
                const mStr = String(calViewMonth + 1).padStart(2, '0');
                const dStr = String(d).padStart(2, '0');
                const fullStr = `${calViewYear}-${mStr}-${dStr}`;
                const cls = [
                    'ts-cal-day',
                    fullStr === selectedStr ? 'selected' : '',
                    fullStr === todayStr ? 'today' : ''
                ].filter(Boolean).join(' ');
                html += `<button type="button" class="${cls}" data-date="${fullStr}">${d}</button>`;
            }
            // 下月补齐
            const totalCells = firstDay + daysInMonth;
            const remain = (7 - (totalCells % 7)) % 7;
            for (let d = 1; d <= remain; d++) {
                html += `<button type="button" class="ts-cal-day other-month" disabled>${d}</button>`;
            }
            daysEl.innerHTML = html;

            daysEl.querySelectorAll('.ts-cal-day[data-date]').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const picked = btn.getAttribute('data-date');
                    if (!picked) return;
                    const popover = document.getElementById('ts-custom-cal-popover');
                    if (popover) popover.classList.remove('open');
                    if (rankDatePicker()) {
                        rankDatePicker().value = picked;
                        rankDatePicker().dispatchEvent(new Event('change'));
                    }
                });
            });
        }

        function bindEvents() {
            document.querySelectorAll('#ts-dist-switch button').forEach(btn => {
                btn.addEventListener('click', async function () {
                    const next = Number(btn.getAttribute('data-interval') || 1);
                    if (next === state.barInterval) return;
                    state.barInterval = next;
                    document.querySelectorAll('#ts-dist-switch button').forEach(x => x.classList.toggle('active', x === btn));
                    await loadSeriesAndRender();
                });
            });

            document.querySelectorAll('#ts-trend-switch button').forEach(btn => {
                btn.addEventListener('click', async function () {
                    const mode = String(btn.getAttribute('data-mode') || 'increment');
                    if (mode === state.trendMode) return;
                    state.trendMode = mode;
                    document.querySelectorAll('#ts-trend-switch button').forEach(x => x.classList.toggle('active', x === btn));
                    await loadSeriesAndRender();
                });
            });

            if (nodeSelect()) {
                nodeSelect().addEventListener('change', async function () {
                    state.selectedNodeUUID = nodeSelect().value || '';
                    updateSelectedBadge();
                    renderRank();
                    await loadSeriesAndRender();
                });
            }

            if (rankDatePicker()) {
                rankDatePicker().addEventListener('change', async function () {
                    state.rankDate = rankDatePicker().value || todayDateStr();
                    syncCustomDateDisplay();
                    await loadRank();
                    if (nodeSelect()) nodeSelect().value = state.selectedNodeUUID;
                    updateSelectedBadge();
                    renderRank();
                    await loadSeriesAndRender();
                });
            }

            // 绑定自定义圆润日历交互
            const calTrigger = document.getElementById('ts-rank-date-trigger');
            const calPopover = document.getElementById('ts-custom-cal-popover');
            const calPrev = document.getElementById('ts-cal-prev');
            const calNext = document.getElementById('ts-cal-next');
            const calToday = document.getElementById('ts-cal-today');

            if (calTrigger && calPopover) {
                calTrigger.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const isOpening = !calPopover.classList.contains('open');
                    if (isOpening) {
                        syncCustomDateDisplay();
                        calPopover.classList.add('open');
                    } else {
                        calPopover.classList.remove('open');
                    }
                });
                document.addEventListener('click', function (e) {
                    if (!calTrigger.contains(e.target)) {
                        calPopover.classList.remove('open');
                    }
                });
            }
            if (calPrev) {
                calPrev.addEventListener('click', function (e) {
                    e.stopPropagation();
                    calViewMonth--;
                    if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
                    renderCustomCalendarGrid();
                });
            }
            if (calNext) {
                calNext.addEventListener('click', function (e) {
                    e.stopPropagation();
                    calViewMonth++;
                    if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
                    renderCustomCalendarGrid();
                });
            }
            if (calToday) {
                calToday.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const t = todayDateStr();
                    if (calPopover) calPopover.classList.remove('open');
                    if (rankDatePicker()) {
                        rankDatePicker().value = t;
                        rankDatePicker().dispatchEvent(new Event('change'));
                    }
                });
            }

            window.addEventListener('resize', function () {
                renderBar();
                renderLine();
                syncRankListHeight();
            });

            // 定时刷新离线标记，避免仅在收到 WS 消息时才更新状态
            setInterval(function () {
                const list = document.getElementById('ts-rank-list');
                if (!list) return;
                list.querySelectorAll('.ts-rank-item').forEach(function (el) {
                    const uuid = String(el.getAttribute('data-uuid') || '');
                    if (uuid) updateRankItemLive(uuid);
                });
            }, 2000);
        }

        window.trafficStatsRefresh = async function () {
            await loadRank();
            if (nodeSelect()) nodeSelect().value = state.selectedNodeUUID;
            updateSelectedBadge();
            renderRank();
            await loadSeriesAndRender();
        };

        document.addEventListener('DOMContentLoaded', async function () {
            try {
                state.rankDate = todayDateStr();
                if (rankDatePicker()) rankDatePicker().value = state.rankDate;
                syncCustomDateDisplay();

                await loadLandingNodes();
                await window.trafficStatsRefresh();
                bindEvents();

                // 启动实时流量 WS 订阅
                connectLiveWS();
            } catch (e) {
                setStatus((e && e.message) ? e.message : '初始化流量统计失败', true);
            }
        });
    })();
</script>
{{end}}
