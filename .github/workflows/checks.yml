name: Validate panel and proxy integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          python -m pip install -r requirements-wg.txt
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: go test ./...
        env:
          NODECTL_TEST_NGINX: /usr/sbin/nginx
      - run: go vet ./...
      - run: go test -race ./internal/database ./internal/requestmeta ./internal/service ./internal/agent/wgrelay ./internal/wgrelay ./internal/server
        env:
          NODECTL_TEST_NGINX: /usr/sbin/nginx
      - run: python -m unittest discover -s tests -v
      - name: Browser interaction regressions
        run: |
          export CHROME_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          node tests/node-wg-ui.cjs
          node tests/wg-ui.cjs
          node tests/traffic-calendar-ui.cjs
          node tests/browser-assets-ui.cjs
          node tests/password-ui.cjs
          node tests/settings-ui.cjs
      - run: bash -n scripts/smoke-docker.sh internal/wgrelay/engine/vendor/wg-multi-relay.sh

  docker:
    name: Docker deployment (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Build with the documented Compose files
        run: docker compose -f compose.wg.yaml -f compose.build.yaml build
      - name: Verify source-built image with persistent Compose data
        run: bash scripts/smoke-docker.sh nodectl-wg:local
      - name: Build the release packaging from the tested native binary
        run: |
          mkdir -p bin
          container=$(docker create nodectl-wg:local)
          trap 'docker rm -v "$container" >/dev/null' EXIT
          docker cp "$container:/app/nodectl" "bin/nodectl-linux-$ARCH"
          docker build --build-arg "TARGETARCH=$ARCH" -f .github/Dockerfile -t nodectl-wg:release-smoke .
      - name: Verify release image with persistent Compose data
        run: bash scripts/smoke-docker.sh nodectl-wg:release-smoke
