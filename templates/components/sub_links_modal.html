<script>
    const subModal = document.getElementById('subLinksModal');
    const subModalCard = document.getElementById('subModalCard');

    // 点击遮罩层关闭
    subModal.addEventListener('click', function(e) {
        if (e.target === subModal) closeSubLinksModal();
    });

    // ESC 键关闭
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && subModal.classList.contains('active')) closeSubLinksModal();
    });

    let currentBaseUrl = '';
    let currentToken = '';
    let currentFormatKey = null;
    let subNodesState = {
        loaded: false,
        v2rayIncludeLanding: false,
        nodeOverrides: {},
        nodes: []
    };

    function escapeSubHtml(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function showSubSaveNotice(text, isError = false) {
        const indicator = document.getElementById('subSaveIndicator');
        if (!indicator) return;
        if (isError) {
            const span = document.createElement('span');
            span.style.color = '#ff3b30';
            span.textContent = text;
            indicator.replaceChildren(span);
        } else {
            indicator.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg> ${escapeSubHtml(text)}`;
        }
        indicator.style.opacity = '1';
        clearTimeout(indicator._hideTimer);
        if (!isError) {
            indicator._hideTimer = setTimeout(() => { indicator.style.opacity = '0'; }, 2000);
        }
    }

    function computeSubNodeEffectiveVisible(node) {
        if (Object.prototype.hasOwnProperty.call(subNodesState.nodeOverrides, node.uuid)) {
            return !!subNodesState.nodeOverrides[node.uuid];
        }
        if (node.routing_type === 2) {
            return !!subNodesState.v2rayIncludeLanding;
        }
        return true;
    }

    function updateSubNodesSummary() {
        const el = document.getElementById('subNodesCardSummary');
        if (!el) return;
        if (!subNodesState.loaded) {
            el.textContent = '勾选导出节点、随时修改节点名';
            return;
        }
        const total = subNodesState.nodes.length;
        const visibleCount = subNodesState.nodes.filter(n => computeSubNodeEffectiveVisible(n) && !n.landing_ss_protected).length;
        const suffix = subNodesState.v2rayIncludeLanding ? '已开启落地' : '落地默认隐藏';
        el.textContent = `当前导出 ${visibleCount} / ${total} 个 · ${suffix}`;
    }

    async function loadSubNodesState() {
        try {
            const res = await fetch('/api/sub/nodes', { cache: 'no-store' });
            const json = await res.json();
            if (json.status === 'success' && json.data) {
                subNodesState.loaded = true;
                subNodesState.v2rayIncludeLanding = !!json.data.v2ray_include_landing;
                subNodesState.nodeOverrides = json.data.node_overrides || {};
                subNodesState.nodes = Array.isArray(json.data.nodes) ? json.data.nodes : [];
                updateSubNodesSummary();
                if (currentFormatKey === 'nodes' || currentFormatKey === 'v2ray') {
                    renderRightPanel(currentFormatKey);
                }
            }
        } catch (e) {
            console.error('加载订阅节点配置失败', e);
        }
    }

    async function persistSubVisibility(payload, noticeText = '订阅配置已保存') {
        try {
            const res = await fetch('/api/sub/visibility', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const json = await res.json();
            if (!res.ok || json.status !== 'success') {
                throw new Error(json.message || '保存失败');
            }
            if (json.data) {
                subNodesState.v2rayIncludeLanding = !!json.data.v2ray_include_landing;
                subNodesState.nodeOverrides = json.data.node_overrides || {};
            }
            updateSubNodesSummary();
            if (currentFormatKey === 'nodes') renderRightPanel('nodes');
            showSubSaveNotice(noticeText);
        } catch (e) {
            showSubSaveNotice(e.message || '保存失败', true);
        }
    }

    function toggleSubNodeVisible(uuid, checked) {
        const node = subNodesState.nodes.find(n => n.uuid === uuid);
        if (!node) return;
        const defaultVisible = node.routing_type === 2 ? !!subNodesState.v2rayIncludeLanding : true;
        const nextOverrides = { ...subNodesState.nodeOverrides };
        if (checked === defaultVisible) {
            delete nextOverrides[uuid];
        } else {
            nextOverrides[uuid] = checked;
        }
        subNodesState.nodeOverrides = nextOverrides;
        updateSubNodesSummary();
        if (currentFormatKey === 'nodes') renderRightPanel('nodes');
        persistSubVisibility({ node_overrides: nextOverrides }, checked ? '已加入订阅' : '已从订阅隐藏');
    }

    function toggleV2RayIncludeLanding(checked) {
        subNodesState.v2rayIncludeLanding = checked;
        updateSubNodesSummary();
        if (currentFormatKey === 'nodes') renderRightPanel('nodes');
        persistSubVisibility({ v2ray_include_landing: checked }, checked ? 'V2Ray 默认包含落地' : 'V2Ray 默认隐藏落地');
    }

    function resetSubVisibilityDefaults() {
        subNodesState.v2rayIncludeLanding = false;
        subNodesState.nodeOverrides = {};
        updateSubNodesSummary();
        if (currentFormatKey === 'nodes') renderRightPanel('nodes');
        persistSubVisibility({ reset: true }, '已恢复默认（隐藏落地）');
    }

    function startSubNodeRename(uuid) {
        const row = document.querySelector(`.sub-node-row[data-uuid="${CSS.escape(uuid)}"]`);
        const node = subNodesState.nodes.find(n => n.uuid === uuid);
        if (!row || !node) return;
        const wrap = row.querySelector('.sub-node-name-wrap');
        if (!wrap || wrap.querySelector('input')) return;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'sub-node-rename-input';
        input.value = node.name || '';
        input.maxLength = 80;
        let committed = false;

        const finish = async (save) => {
            if (committed) return;
            committed = true;
            const nextName = input.value.trim();
            if (!save || !nextName || nextName === node.name) {
                renderRightPanel('nodes');
                return;
            }
            try {
                const res = await fetch('/api/node/rename', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uuid, name: nextName })
                });
                const json = await res.json();
                if (!res.ok || json.status !== 'success') {
                    throw new Error(json.message || '改名失败');
                }
                node.name = nextName;
                if (window.allNodesData && window.allNodesData[uuid]) {
                    window.allNodesData[uuid].name = nextName;
                }
                renderRightPanel('nodes');
                showSubSaveNotice('节点名已更新');
                if (typeof loadNodesList === 'function') loadNodesList();
                if (typeof window.trafficStatsRefresh === 'function') window.trafficStatsRefresh();
            } catch (e) {
                renderRightPanel('nodes');
                showSubSaveNotice(e.message || '改名失败', true);
            }
        };

        input.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
            else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); finish(false); }
        });
        input.addEventListener('blur', () => finish(true));

        wrap.replaceChildren(input);
        input.focus();
        input.select();
    }

    function openSubNodesManager() {
        const card = document.querySelector('#wrap_nodes .sub-format-card');
        if (card) selectSubFormat('nodes', card);
    }

    // 预定义的链接与展示文案数据
    const subFormatData = {
        clash: {
            title: "😼 Clash Meta 订阅",
            desc: "推荐使用 <b>Clash Verge Rev</b> 或 <b>OpenClash</b>。<br>已激活 WG 的入口节点自动附加 <b>WG</b> 标识，WG 落地内部 SS 自动隐藏。",
            getLink: () => `${currentBaseUrl}/sub/clash?token=${currentToken}`
        },
        v2ray: {
            title: "🌐 V2Ray / 通用 Base64",
            desc: "适用于 <b>Shadowrocket（小火箭）</b>、<b>v2rayN</b>、<b>v2rayNG</b>。<br>默认自动隐藏落地节点，可在左侧「订阅节点与名称」自由勾选。",
            getLink: () => `${currentBaseUrl}/sub/v2ray?token=${currentToken}`
        }
    };

    // 辅助函数：根据文字自适应 Textarea 的高度
    function resizeSubLinkTextarea() {
        const ta = document.getElementById('currentSubLinkText');
        if (ta && ta.offsetParent !== null) {
            ta.style.height = 'auto'; // 先归零
            ta.style.height = (ta.scrollHeight + 2) + 'px'; // 重新设置计算高度
        }
    }

    // 监听窗口大小变化
    function adjustRightPanelPosition() {
        const rightCol = document.getElementById('subRightCol');
        const body = document.querySelector('.sub-body');

        if (window.innerWidth <= 768) {
            if (!currentFormatKey) {
                rightCol.style.display = 'none';
                if (rightCol.parentNode !== body) body.appendChild(rightCol);
            } else {
                rightCol.style.display = 'flex';
                const wrapper = document.getElementById('wrap_' + currentFormatKey);
                if (wrapper && rightCol.parentNode !== wrapper) {
                    wrapper.appendChild(rightCol);
                }
            }
        } else {
            if (currentFormatKey) rightCol.style.display = 'flex';
            if (rightCol.parentNode !== body) {
                body.appendChild(rightCol);
            }
        }
        resizeSubLinkTextarea();
    }
    let subLastIsMobile = window.innerWidth <= 768;
    window.addEventListener('resize', () => {
        const currentIsMobile = window.innerWidth <= 768;
        if (currentIsMobile !== subLastIsMobile) {
            subLastIsMobile = currentIsMobile;
            adjustRightPanelPosition();
        }
    });

    // 格式卡片点击切换逻辑
    function selectSubFormat(formatKey, cardElement) {
        if (currentFormatKey === formatKey) {
            if (window.innerWidth <= 768) {
                currentFormatKey = null;
                cardElement.classList.remove('active');
                subModalCard.classList.remove('has-content');
                adjustRightPanelPosition();
                return;
            }
        }

        document.querySelectorAll('.sub-format-card').forEach(c => c.classList.remove('active'));
        cardElement.classList.add('active');
        currentFormatKey = formatKey;

        renderRightPanel(formatKey);
        adjustRightPanelPosition();

        // 渲染完 DOM 后立即计算高度
        setTimeout(resizeSubLinkTextarea, 20);

        if (window.innerWidth <= 768) {
            setTimeout(() => {
                cardElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        }
    }

    // 核心渲染逻辑：生成一键导入按钮、二维码或节点管理面板
    function renderRightPanel(formatKey) {
        const contentDiv = document.getElementById('subRightContent');
        if (formatKey === 'nodes') {
            renderSubNodesManagerPanel(contentDiv);
            return;
        }

        const data = subFormatData[formatKey];
        const link = data.getLink();
        const subName = document.getElementById('inputSubName').value.trim() || 'WireArc';

        let importBtnHtml = '';
        // 默认不加 has-import 类，这样只有复制按钮时会独占一行撑满
        let gridClass = 'sub-actions-grid';

        if (formatKey === 'clash') {
            // 只有 Clash 模式下，加上 has-import 变成左右两列，并生成导入按钮
            gridClass = 'sub-actions-grid has-import';
            const clashUrl = `clash://install-config?url=${encodeURIComponent(link)}&name=${encodeURIComponent(subName)}`;
            importBtnHtml = `
                <a href="${clashUrl}" class="btn-sub-action btn-import">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    导入 Clash
                </a>
            `;
        }

        let summaryBannerHtml = '';
        if (formatKey === 'v2ray' && subNodesState.loaded) {
            const visibleCount = subNodesState.nodes.filter(n => computeSubNodeEffectiveVisible(n) && !n.landing_ss_protected).length;
            const landingHint = subNodesState.v2rayIncludeLanding ? '已开启导出落地' : '落地节点默认隐藏';
            summaryBannerHtml = `
                <div class="sub-nodes-banner">
                    <span>当前导出 <b>${visibleCount}</b> 个节点（${landingHint}）</span>
                    <button type="button" class="sub-nodes-banner-link" onclick="openSubNodesManager()">管理节点 →</button>
                </div>
            `;
        }

        contentDiv.innerHTML = `
            <div class="sub-right-header">
                <div class="sub-right-title">${data.title}</div>
                <div class="sub-right-desc">${data.desc}</div>
            </div>
            ${summaryBannerHtml}
            <div class="qr-wrapper">
                <div class="qr-box" id="qrCodeContainer"></div>
            </div>

            <textarea class="sub-link-textarea" id="currentSubLinkText" readonly onclick="this.select()">${link}</textarea>
            
            <div class="${gridClass}">
                <button class="btn-sub-action btn-copy" id="btnCopySubLink" onclick="copyCurrentSubLink()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    复制链接
                </button>
                ${importBtnHtml}
            </div>
        `;

        const qrContainer = document.getElementById('qrCodeContainer');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
            text: link,
            width: 140,
            height: 140,
            colorDark: "#1d1d1f",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });
    }

    function renderSubNodesManagerPanel(contentDiv) {
        const directNodes = subNodesState.nodes.filter(n => n.routing_type !== 2);
        const landingNodes = subNodesState.nodes.filter(n => n.routing_type === 2);

        const renderRow = (node) => {
            const visible = computeSubNodeEffectiveVisible(node);
            const effectiveChecked = visible && !node.landing_ss_protected;
            const iso = String(node.region || '').trim().toLowerCase();
            const flagHtml = /^[a-z]{2}$/.test(iso)
                ? `<img class="sub-node-flag" src="https://flagcdn.com/${iso}.svg" width="18" height="13" alt="${iso}" loading="lazy">`
                : '';

            let badgeHtml = '';
            if (node.wg_role === 'entry') {
                const isActive = node.wg_status === 'active';
                badgeHtml = `<span class="sub-node-badge ${isActive ? 'wg-active' : 'wg-pending'}" title="已激活 WG 时订阅名自动追加 WG 标识">WG</span>`;
            } else if (node.landing_ss_protected) {
                badgeHtml = `<span class="sub-node-badge wg-landing" title="该节点正在作为 WG 落地，内部 SS 链接已自动保护不输出到客户端订阅">WG 落地 · SS已保护</span>`;
            } else if (node.routing_type === 2) {
                badgeHtml = `<span class="sub-node-badge landing">落地</span>`;
            }

            const safeUuid = escapeSubHtml(node.uuid);
            const safeName = escapeSubHtml(node.name || node.uuid);
            const checkDisabled = node.landing_ss_protected ? 'disabled title="WG 落地节点内部 SS 已自动隐藏，防止直连暴露"' : '';
            return `
                <div class="sub-node-row ${effectiveChecked ? '' : 'is-hidden'}" data-uuid="${safeUuid}">
                    <div class="sub-node-left">
                        <input type="checkbox" class="sub-node-check" ${effectiveChecked ? 'checked' : ''} ${checkDisabled} onchange="toggleSubNodeVisible('${safeUuid}', this.checked)">
                        ${flagHtml}
                        <div class="sub-node-name-wrap">
                            <span class="sub-node-name" title="${safeName}" ondblclick="startSubNodeRename('${safeUuid}')">${safeName}</span>
                        </div>
                    </div>
                    <div class="sub-node-right">
                        ${badgeHtml}
                        <button type="button" class="sub-node-edit-btn" title="修改节点名称（WG 运行中也可直接改名）" onclick="startSubNodeRename('${safeUuid}')">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        };

        const renderGroup = (title, list, hint) => {
            if (list.length === 0) return '';
            return `
                <div class="sub-node-group">
                    <div class="sub-node-group-title">
                        <span>${title}（${list.length}）</span>
                        <span style="font-weight:500; color:#a1a1a6;">${hint}</span>
                    </div>
                    <div class="sub-node-list">${list.map(renderRow).join('')}</div>
                </div>
            `;
        };

        const bodyHtml = !subNodesState.loaded
            ? '<div class="sub-nodes-empty">正在加载节点列表...</div>'
            : subNodesState.nodes.length === 0
                ? '<div class="sub-nodes-empty">暂无可配置订阅的节点</div>'
                : renderGroup('直连 / WG 专线', directNodes, '默认导出') + renderGroup('落地节点', landingNodes, 'V2Ray 默认隐藏');

        contentDiv.innerHTML = `
            <div class="sub-right-header" style="margin-bottom: 14px; padding-bottom: 12px;">
                <div class="sub-right-title">📋 订阅节点与名称</div>
                <div class="sub-right-desc">勾选控制哪些节点出现在订阅中，点击右侧铅笔即可随时改名；改动自动保存，<b>不会中断运行中的 WG 隧道</b>。</div>
            </div>
            <div class="sub-nodes-toolbar">
                <label class="sub-landing-toggle">
                    <input type="checkbox" ${subNodesState.v2rayIncludeLanding ? 'checked' : ''} onchange="toggleV2RayIncludeLanding(this.checked)">
                    <span>V2Ray 订阅默认包含落地节点</span>
                </label>
                <button type="button" class="sub-tool-btn" onclick="resetSubVisibilityDefaults()">恢复默认</button>
            </div>
            ${bodyHtml}
        `;
    }

    // 打开弹窗并默认直接展开第一项 (修复动画带来的高度错误)
    async function openSubLinksModal() {
        // 先为卡片加上 has-content，让弹窗初始就呈现 800px 宽度
        subModalCard.classList.add('has-content');
        document.getElementById('subRightCol').style.display = 'flex';
        subModal.classList.add('active');
        document.getElementById('subSaveIndicator').style.opacity = '0';

        // 重置状态
        currentFormatKey = null;
        document.querySelectorAll('.sub-format-card').forEach(c => c.classList.remove('active'));

        try {
            const [res] = await Promise.all([
                fetch('/api/get-settings'),
                loadSubNodesState()
            ]);
            const result = await res.json();

            if (result.status === 'success') {
                const data = result.data;
                currentToken = data.sub_token || '';
                currentBaseUrl = data.panel_url ? data.panel_url.replace(/\/+$/, '') : window.location.origin;
                document.getElementById('inputSubName').value = data.sub_custom_name || 'WireArc';

                // 数据加载完毕，直接选中 Clash 并渲染
                const clashCard = document.querySelector('#wrap_clash .sub-format-card');
                selectSubFormat('clash', clashCard);
            }
        } catch (e) { console.error("加载配置失败", e); }
    }

    // 关闭弹窗
    function closeSubLinksModal() {
        subModal.classList.remove('active');
        // 延迟移除 has-content，避免关闭淡出时触发突兀的尺寸回缩
        setTimeout(() => {
            subModalCard.classList.remove('has-content');
            currentFormatKey = null;
        }, 300);
    }

    // 自动静默保存订阅名称 (防抖)，并自动刷新右侧的参数
    let subNameSaveTimer = null;
    function saveCustomSubNameDebounced() {
        if (!document.getElementById('subLinksModal').classList.contains('active')) {
            return;
        }

        clearTimeout(subNameSaveTimer);
        const indicator = document.getElementById('subSaveIndicator');
        indicator.innerHTML = '<span style="color:#888;">保存中...</span>';
        indicator.style.opacity = '1';

        subNameSaveTimer = setTimeout(async () => {
            const newName = document.getElementById('inputSubName').value.trim() || 'WireArc';
            try {
                const res = await fetch('/api/update-settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sub_custom_name: newName })
                });
                const savedResult = await res.json();
                if (!res.ok || savedResult.status !== "success") throw new Error(savedResult.message || "保存失败");
                if (res.ok) {
                    indicator.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg> 名称已保存`;
                    setTimeout(() => indicator.style.opacity = '0', 2000);

                    if (currentFormatKey) {
                        renderRightPanel(currentFormatKey);
                        setTimeout(resizeSubLinkTextarea, 10);
                    }
                }
            } catch (e) {
                const failure = document.createElement("span");
                failure.style.color = "#ff3b30";
                failure.textContent = e.message || "保存失败";
                indicator.replaceChildren(failure);
            }
        }, 600);
    }

    // 一键复制链接逻辑
    function copyCurrentSubLink() {
        const textarea = document.getElementById('currentSubLinkText');
        const btn = document.getElementById('btnCopySubLink');

        textarea.select();
        textarea.setSelectionRange(0, 99999);

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textarea.value).then(() => {
                showCopySuccess(btn);
            }).catch(() => fallbackCopy(btn));
        } else {
            fallbackCopy(btn);
        }
    }

    function fallbackCopy(btn) {
        try {
            document.execCommand('copy');
            showCopySuccess(btn);
        } catch (err) {
            alert('复制失败，请直接在上方框内长按手动复制链接');
        }
    }

    function showCopySuccess(btn) {
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '复制成功!';
        btn.classList.add('copied');

        setTimeout(() => {
            btn.innerHTML = originalHtml;
            btn.classList.remove('copied');
        }, 2000);
    }
</script>
